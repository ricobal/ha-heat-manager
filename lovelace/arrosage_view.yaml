                primary: "Moyen"
                secondary: "{{ states('input_number.etherain_temps_arrosage_cycle_moyen_zone_1')|int(0) + states('input_number.etherain_temps_arrosage_cycle_moyen_zone_2')|int(0) + states('input_number.etherain_temps_arrosage_cycle_moyen_zone_3')|int(0) + states('input_number.etherain_temps_arrosage_cycle_moyen_zone_4')|int(0) + states('input_number.etherain_temps_arrosage_cycle_moyen_zone_5')|int(0) }} min"
                icon: "mdi:timer-outline"
