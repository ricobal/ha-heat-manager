              icon_color: "white"
              multiline_secondary: true
              tap_action:
                action: "none"
              hold_action:
                action: "none"
              card_mod:
                style: "ha-card { background: rgb(21, 101, 192); border: none; box-shadow: none; --primary-text-color: white; --secondary-text-color: rgba(255, 255, 255, 0.85); --card-primary-color: white; --card-secondary-color: rgba(255, 255, 255, 0.85); }"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-title-card"
            title: ""
            subtitle: "COMMANDES"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "grid"
            columns: 3
            square: false
            cards:
              -
                type: "button"
                entity: "climate.radiateur_parents"
                name: "Auto"
                icon: "mdi:thermostat-auto"
                show_state: false
                icon_height: "24px"
                tap_action:
                  action: "perform-action"
                  perform_action: "climate.set_hvac_mode"
                  data:
                    hvac_mode: "auto"
                  target:
                    entity_id: "climate.radiateur_parents"
                hold_action:
                  action: "none"
                card_mod:
                  style: "ha-card { height: 76px; border-radius: 14px 0 0 14px; box-shadow: none; border: 1px solid var(--divider-color); background: {{ 'rgb(0, 131, 143)' if is_state('climate.radiateur_parents', 'auto') else 'var(--card-background-color)' }}; color: {{ 'white' if is_state('climate.radiateur_parents', 'auto') else 'var(--primary-text-color)' }}; --state-icon-color: {{ 'white' if is_state('climate.radiateur_parents', 'auto') else 'var(--secondary-text-color)' }}; --state-icon-active-color: {{ 'white' if is_state('climate.radiateur_parents', 'auto') else 'var(--secondary-text-color)' }}; }"
              -
                type: "button"
                entity: "climate.radiateur_parents"
                name: "Manuel"
                icon: "mdi:fire"
                show_state: false
                icon_height: "24px"
                tap_action:
                  action: "perform-action"
                  perform_action: "climate.set_hvac_mode"
                  data:
                    hvac_mode: "heat"
                  target:
                    entity_id: "climate.radiateur_parents"
                hold_action:
                  action: "none"
                card_mod:
                  style: "ha-card { height: 76px; border-radius: 0; box-shadow: none; border: 1px solid var(--divider-color); background: {{ 'rgb(194, 75, 0)' if is_state('climate.radiateur_parents', 'heat') else 'var(--card-background-color)' }}; color: {{ 'white' if is_state('climate.radiateur_parents', 'heat') else 'var(--primary-text-color)' }}; --state-icon-color: {{ 'white' if is_state('climate.radiateur_parents', 'heat') else 'var(--secondary-text-color)' }}; --state-icon-active-color: {{ 'white' if is_state('climate.radiateur_parents', 'heat') else 'var(--secondary-text-color)' }}; }"
              -
                type: "button"
                entity: "climate.radiateur_parents"
                name: "Arrêt"
                icon: "mdi:power"
                show_state: false
                icon_height: "24px"
                tap_action:
                  action: "perform-action"
                  perform_action: "climate.set_hvac_mode"
                  data:
                    hvac_mode: "off"
                  target:
                    entity_id: "climate.radiateur_parents"
                hold_action:
                  action: "none"
                card_mod:
                  style: "ha-card { height: 76px; border-radius: 0 14px 14px 0; box-shadow: none; border: 1px solid var(--divider-color); background: {{ 'rgb(85, 99, 112)' if is_state('climate.radiateur_parents', 'off') else 'var(--card-background-color)' }}; color: {{ 'white' if is_state('climate.radiateur_parents', 'off') else 'var(--primary-text-color)' }}; --state-icon-color: {{ 'white' if is_state('climate.radiateur_parents', 'off') else 'var(--secondary-text-color)' }}; --state-icon-active-color: {{ 'white' if is_state('climate.radiateur_parents', 'off') else 'var(--secondary-text-color)' }}; }"
            card_mod:
              style: "ha-card { --grid-card-gap: 0px; } :host { --grid-card-gap: 0px; }"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "conditional"
            conditions:
              -
                condition: "state"
                entity: "climate.radiateur_parents"
                state: "heat"
            card:
              type: "vertical-stack"
              cards:
                -
                  type: "custom:mushroom-template-card"
                  entity: "climate.radiateur_parents"
                  primary: "Consigne"
                  secondary: "Température actuelle : {{ state_attr('climate.radiateur_parents', 'current_temperature') | string | replace('.', ',') }} °C"
                  icon: "mdi:thermostat"
                  icon_color: "{{ 'deep-orange' if state_attr('climate.radiateur_parents', 'hvac_action') == 'heating' else 'cyan' }}"
                  tap_action:
                    action: "more-info"
                  hold_action:
                    action: "none"
                  card_mod:
                    style: "ha-card { border: 1px solid rgba(0, 188, 212, 0.45); border-left: 4px solid #00acc1; border-bottom: none; border-radius: 12px 12px 0 0; background: rgba(0, 188, 212, 0.07); box-shadow: none; }"
                -
                  type: "custom:mushroom-climate-card"
                  entity: "climate.radiateur_parents"
                  primary_info: "none"
                  secondary_info: "none"
                  icon_type: "none"
                  show_temperature_control: true
                  collapsible_controls: false
                  card_mod:
                    style: "ha-card { border: 1px solid rgba(0, 188, 212, 0.45); border-left: 4px solid #00acc1; border-top: none; border-radius: 0 0 12px 12px; background: rgba(0, 188, 212, 0.07); box-shadow: none; margin-top: -8px; }"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "conditional"
            conditions:
              -
                condition: "state"
                entity: "climate.radiateur_parents"
                state: "auto"
            card:
              type: "custom:mushroom-template-card"
              entity: "climate.radiateur_parents"
              primary: "Consigne de planning : {{ state_attr('climate.radiateur_parents', 'temperature') | string | replace('.', ',') }} °C"
              secondary: |-
                Température actuelle : {{ state_attr('climate.radiateur_parents', 'current_temperature') | string | replace('.', ',') }} °C
                {% set j = ['monday','tuesday','wednesday','thursday','friday','saturday','sunday'][now().weekday()] %}{% set p = states('text.radiateur_parents_weekly_schedule_' ~ j) %}{% set ns = namespace(out=[], last='') %}{% for t in p.split(' ') if '/' in t %}{% if t != ns.last %}{% set ns.out = ns.out + ['à ' ~ t.split('/')[0] ~ ' = ' ~ t.split('/')[1] ~ '°C'] %}{% endif %}{% set ns.last = t %}{% endfor %}Planning : {{ ns.out | join(', ') if ns.out else 'indisponible' }}
              icon: "mdi:calendar-clock"
              icon_color: "cyan"
              multiline_secondary: true
              tap_action:
                action: "none"
              hold_action:
                action: "none"
              card_mod:
                style: "ha-card { border: 1px solid rgba(0, 188, 212, 0.45); border-left: 4px solid #00acc1; background: rgba(0, 188, 212, 0.07); box-shadow: none; }"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            entity: "climate.radiateur_parents"
            primary: "{{ 'Demande de chauffage' if states('climate.radiateur_parents') in ['auto','heat'] and state_attr('climate.radiateur_parents', 'temperature') is number and state_attr('climate.radiateur_parents', 'current_temperature') is number and state_attr('climate.radiateur_parents', 'temperature') - state_attr('climate.radiateur_parents', 'current_temperature') > 0.5 else 'Aucune demande' }}"
            secondary: "Batterie {{ states('sensor.radiateur_parents_battery') }} % · {{ states('climate.radiateur_parents') }}"
            icon: "mdi:radiator"
            icon_color: "{{ 'deep-orange' if state_attr('climate.radiateur_parents', 'hvac_action') == 'heating' else 'disabled' }}"
            tap_action:
              action: "more-info"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-chips-card"
            alignment: "justify"
            chips:
              -
                type: "template"
                content: "Boost"
                icon: "mdi:fire"
                tap_action:
                  action: "perform-action"
                  perform_action: "script.chauffage_boost_cible"
                  data:
                    cible: "chambre_parents"
                icon_color: "deep-orange"
              -
                type: "template"
                content: "Planning"
                icon: "mdi:calendar-clock"
                tap_action:
                  action: "navigate"
                  navigation_path: "/lovelace-mobile/chauffage-planning-piece-chambre-parents"
            grid_options:
              columns: "full"
              rows: "auto"
    subview: true
    back_path: "/lovelace-mobile/chauffage-zone-parents"
