# Heat Manager mobile v2.1 — vues générées
# Fusionner les éléments de `views` dans le tableau de bord lovelace-mobile après validation.
# Dépendance : Mushroom déjà installé.

views:
  -
    title: "Chauffage"
    path: "chauffage-v2"
    type: "sections"
    max_columns: 1
    sections:
      -
        type: "grid"
        cards:
          -
            type: "custom:mushroom-template-card"
            entity: "climate.atlantic_alfea_m_duo_chauffage_circuit_1"
            primary: "Pompe à chaleur"
            secondary: "{{ states('climate.atlantic_alfea_m_duo_chauffage_circuit_1') | title }} · consigne {{ states('number.atlantic_alfea_m_duo_temperature_de_consigne') }} °C · ambiance {{ states('sensor.atlantic_alfea_m_duo_temperature_thermostat_z1') }} °C"
            icon: "mdi:heat-pump"
            icon_color: "{{ 'deep-orange' if not is_state('climate.atlantic_alfea_m_duo_chauffage_circuit_1', 'off') else 'disabled' }}"
            badge_icon: "{{ 'mdi:fire' if not is_state('climate.atlantic_alfea_m_duo_chauffage_circuit_1', 'off') else 'mdi:power' }}"
            badge_color: "{{ 'deep-orange' if not is_state('climate.atlantic_alfea_m_duo_chauffage_circuit_1', 'off') else 'grey' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-pac"
          -
            type: "custom:mushroom-template-card"
            entity: "sensor.atlantic_alfea_m_duo_temperature_ecs"
            primary: "Eau chaude"
            secondary: "{{ states('sensor.atlantic_alfea_m_duo_temperature_ecs') }} °C · {{ 'autorisée' if is_state('switch.atlantic_alfea_m_duo_eau_chaude', 'on') else 'désactivée' }} · cycle {{ 'actif' if is_state('binary_sensor.atlantic_alfea_m_duo_cycle_ecs_capacite_99', 'on') else 'inactif' }}"
            icon: "mdi:water-boiler"
            icon_color: "{{ 'deep-orange' if is_state('binary_sensor.atlantic_alfea_m_duo_cycle_ecs_capacite_99', 'on') else 'cyan' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-ecs"
          -
            type: "custom:mushroom-template-card"
            entity: "switch.atlantic_alfea_m_duo_absence"
            primary: "Absence"
            secondary: "{{ states('sensor.atlantic_alfea_m_duo_absence') }}{% if is_state('switch.atlantic_alfea_m_duo_absence', 'on') %} · jusqu’au {{ states('datetime.atlantic_alfea_m_duo_fin_absence') }}{% endif %}"
            icon: "mdi:home-export-outline"
            icon_color: "{{ 'cyan' if is_state('switch.atlantic_alfea_m_duo_absence', 'on') else 'disabled' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-absence"
          -
            type: "custom:mushroom-template-card"
            entity: "binary_sensor.chauffage_demande_chauffage"
            primary: "Vannes thermostatiques · {{ states('input_select.chauffage_mode_maison') }}"
            secondary: "{{ state_attr('binary_sensor.chauffage_demande_chauffage', 'nombre_pieces_en_demande') | int(0) }} pièces demandent du chauffage"
            icon: "mdi:radiator"
            icon_color: "{{ 'deep-orange' if is_state('binary_sensor.chauffage_demande_chauffage', 'on') else 'disabled' }}"
            tap_action:
              action: "more-info"
          -
            type: "custom:mushroom-select-card"
            entity: "input_select.chauffage_mode_maison"
            name: "Mode maison"
            icon: "mdi:home-thermometer-outline"
          -
            type: "custom:mushroom-template-card"
            entity: "binary_sensor.chauffage_demande_chauffage"
            primary: "Plus forte demande"
            secondary: "{{ state_attr('binary_sensor.chauffage_demande_chauffage', 'piece_ecart_maximum') }} · {{ state_attr('binary_sensor.chauffage_demande_chauffage', 'ecart_maximum') }} °C sous la consigne"
            icon: "mdi:chart-line-variant"
            icon_color: "{{ 'deep-orange' if state_attr('binary_sensor.chauffage_demande_chauffage', 'ecart_maximum') | float(0) > 0.5 else 'disabled' }}"
            tap_action:
              action: "more-info"
          -
            type: "custom:mushroom-title-card"
            title: "Zones"
            subtitle: "Synthèse uniquement · commandes dans chaque pièce"
          -
            type: "custom:mushroom-template-card"
            entity: "climate.radiateur_parents"
            primary: "Zone parents"
            secondary: >-
              {% set entities = ['climate.radiateur_parents', 'climate.radiateur_dressing', 'climate.radiateur_sdb_parents'] %}
              {% set ns = namespace(total=0, temperatures=[]) %}
              {% for entity in entities %}{% set target = state_attr(entity, 'temperature') %}{% set current = state_attr(entity, 'current_temperature') %}{% if current is number %}{% set ns.temperatures = ns.temperatures + [current] %}{% endif %}{% if states(entity) in ['auto','heat'] and target is number and current is number and target-current > 0.5 %}{% set ns.total = ns.total + 1 %}{% endif %}{% endfor %}
              {% set moyenne = (ns.temperatures | sum / ns.temperatures | count) | round(1) if ns.temperatures | count else none %}{{ ns.total }} sur 3 en demande · {{ moyenne ~ ' °C' if moyenne is not none else 'température indisponible' }}
            icon: "mdi:bed-king-outline"
            icon_color: "{{ 'deep-orange' if expand(['climate.radiateur_parents', 'climate.radiateur_dressing', 'climate.radiateur_sdb_parents']) | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count > 0 else 'disabled' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-zone-parents"
          -
            type: "custom:mushroom-template-card"
            entity: "climate.radiateur_chambre_julie"
            primary: "1er étage"
            secondary: >-
              {% set entities = ['climate.radiateur_chambre_julie', 'climate.radiateur_chambre_pablo', 'climate.radiateur_grande_chambre_amis', 'climate.radiateur_petite_chambre_amis', 'climate.radiateur_chambre_mathias', 'climate.radiateur_sdb_garcons', 'climate.radiateur_sdb_julie'] %}
              {% set ns = namespace(total=0, temperatures=[]) %}
              {% for entity in entities %}{% set target = state_attr(entity, 'temperature') %}{% set current = state_attr(entity, 'current_temperature') %}{% if current is number %}{% set ns.temperatures = ns.temperatures + [current] %}{% endif %}{% if states(entity) in ['auto','heat'] and target is number and current is number and target-current > 0.5 %}{% set ns.total = ns.total + 1 %}{% endif %}{% endfor %}
              {% set moyenne = (ns.temperatures | sum / ns.temperatures | count) | round(1) if ns.temperatures | count else none %}{{ ns.total }} sur 7 en demande · {{ moyenne ~ ' °C' if moyenne is not none else 'température indisponible' }}
            icon: "mdi:home-floor-1"
            icon_color: "{{ 'deep-orange' if expand(['climate.radiateur_chambre_julie', 'climate.radiateur_chambre_pablo', 'climate.radiateur_grande_chambre_amis', 'climate.radiateur_petite_chambre_amis', 'climate.radiateur_chambre_mathias', 'climate.radiateur_sdb_garcons', 'climate.radiateur_sdb_julie']) | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count > 0 else 'disabled' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-zone-premier-etage"
          -
            type: "custom:mushroom-template-card"
            entity: "climate.radiateur_buanderie"
            primary: "Buanderie"
            secondary: >-
              {% set entities = ['climate.radiateur_buanderie'] %}
              {% set ns = namespace(total=0, temperatures=[]) %}
              {% for entity in entities %}{% set target = state_attr(entity, 'temperature') %}{% set current = state_attr(entity, 'current_temperature') %}{% if current is number %}{% set ns.temperatures = ns.temperatures + [current] %}{% endif %}{% if states(entity) in ['auto','heat'] and target is number and current is number and target-current > 0.5 %}{% set ns.total = ns.total + 1 %}{% endif %}{% endfor %}
              {% set moyenne = (ns.temperatures | sum / ns.temperatures | count) | round(1) if ns.temperatures | count else none %}{{ ns.total }} sur 1 en demande · {{ moyenne ~ ' °C' if moyenne is not none else 'température indisponible' }}
            icon: "mdi:washing-machine"
            icon_color: "{{ 'deep-orange' if expand(['climate.radiateur_buanderie']) | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count > 0 else 'disabled' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-piece-buanderie"
          -
            type: "custom:mushroom-template-card"
            entity: "climate.radiateur_atelier"
            primary: "Sous-sol"
            secondary: >-
              {% set entities = ['climate.radiateur_atelier', 'climate.radiateur_salle_cine'] %}
              {% set ns = namespace(total=0, temperatures=[]) %}
              {% for entity in entities %}{% set target = state_attr(entity, 'temperature') %}{% set current = state_attr(entity, 'current_temperature') %}{% if current is number %}{% set ns.temperatures = ns.temperatures + [current] %}{% endif %}{% if states(entity) in ['auto','heat'] and target is number and current is number and target-current > 0.5 %}{% set ns.total = ns.total + 1 %}{% endif %}{% endfor %}
              {% set moyenne = (ns.temperatures | sum / ns.temperatures | count) | round(1) if ns.temperatures | count else none %}{{ ns.total }} sur 2 en demande · {{ moyenne ~ ' °C' if moyenne is not none else 'température indisponible' }}
            icon: "mdi:home-floor-negative-1"
            icon_color: "{{ 'deep-orange' if expand(['climate.radiateur_atelier', 'climate.radiateur_salle_cine']) | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count > 0 else 'disabled' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-zone-sous-sol"
          -
            type: "custom:mushroom-template-card"
            primary: "Paramètres"
            secondary: "Profils maison · durée du boost"
            icon: "mdi:cog-outline"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-parametres"
    icon: "mdi:radiator"
  -
    title: "Pompe à chaleur"
    path: "chauffage-pac"
    type: "sections"
    max_columns: 1
    sections:
      -
        type: "grid"
        cards:
          -
            type: "custom:mushroom-title-card"
            title: "Chauffage"
            subtitle: "Commandes générales de la pompe à chaleur"
          -
            type: "custom:mushroom-chips-card"
            alignment: "justify"
            chips:
              -
                type: "template"
                content: "Auto"
                icon: "mdi:autorenew"
                tap_action:
                  action: "perform-action"
                  perform_action: "climate.set_hvac_mode"
                  data:
                    hvac_mode: "auto"
                  target:
                    entity_id: "climate.atlantic_alfea_m_duo_chauffage_circuit_1"
                icon_color: "{{ 'cyan' if is_state('climate.atlantic_alfea_m_duo_chauffage_circuit_1', 'auto') else 'disabled' }}"
              -
                type: "template"
                content: "Marche"
                icon: "mdi:fire"
                tap_action:
                  action: "perform-action"
                  perform_action: "climate.set_hvac_mode"
                  data:
                    hvac_mode: "heat"
                  target:
                    entity_id: "climate.atlantic_alfea_m_duo_chauffage_circuit_1"
                icon_color: "{{ 'deep-orange' if is_state('climate.atlantic_alfea_m_duo_chauffage_circuit_1', 'heat') else 'disabled' }}"
              -
                type: "template"
                content: "Arrêt"
                icon: "mdi:power"
                tap_action:
                  action: "perform-action"
                  perform_action: "climate.set_hvac_mode"
                  data:
                    hvac_mode: "off"
                  target:
                    entity_id: "climate.atlantic_alfea_m_duo_chauffage_circuit_1"
                icon_color: "{{ 'grey' if is_state('climate.atlantic_alfea_m_duo_chauffage_circuit_1', 'off') else 'disabled' }}"
          -
            type: "custom:mushroom-number-card"
            entity: "number.atlantic_alfea_m_duo_temperature_de_consigne"
            name: "Consigne générale"
            icon: "mdi:thermostat"
            display_mode: "buttons"
          -
            type: "horizontal-stack"
            cards:
              -
                type: "custom:mushroom-template-card"
                entity: "sensor.atlantic_alfea_m_duo_temperature_thermostat_z1"
                primary: "{{ states('sensor.atlantic_alfea_m_duo_temperature_thermostat_z1') }} °C"
                secondary: "Thermostat Z1"
                icon: "mdi:home-thermometer-outline"
              -
                type: "custom:mushroom-template-card"
                entity: "sensor.atlantic_alfea_m_duo_temperature_exterieure"
                primary: "{{ states('sensor.atlantic_alfea_m_duo_temperature_exterieure') }} °C"
                secondary: "Extérieur"
                icon: "mdi:thermometer"
          -
            type: "custom:mushroom-template-card"
            primary: "Planning chauffage global"
            secondary: "Programme utilisé en mode Auto"
            icon: "mdi:calendar-clock"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-pac-planning"
          -
            type: "custom:mushroom-template-card"
            primary: "État technique"
            secondary: "Pression et températures"
            icon: "mdi:gauge"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-pac-technique"
    subview: true
    back_path: "/lovelace-mobile/chauffage-v2"
  -
    title: "Planning chauffage"
    path: "chauffage-pac-planning"
    type: "sections"
    max_columns: 1
    sections:
      -
        type: "grid"
        cards:
          -
            type: "custom:mushroom-title-card"
            title: "Planning chauffage global"
            subtitle: "Programme lu depuis l’Alféa M"
          -
            type: "entities"
            show_header_toggle: false
            entities:
              -
                entity: "sensor.atlantic_alfea_m_duo_lundi_programme_chauffage"
                name: "Lundi"
              -
                entity: "sensor.atlantic_alfea_m_duo_mardi_programme_chauffage"
                name: "Mardi"
              -
                entity: "sensor.atlantic_alfea_m_duo_mercredi_programme_chauffage"
                name: "Mercredi"
              -
                entity: "sensor.atlantic_alfea_m_duo_jeudi_programme_chauffage"
                name: "Jeudi"
              -
                entity: "sensor.atlantic_alfea_m_duo_vendredi_programme_chauffage"
                name: "Vendredi"
              -
                entity: "sensor.atlantic_alfea_m_duo_samedi_programme_chauffage"
                name: "Samedi"
              -
                entity: "sensor.atlantic_alfea_m_duo_dimanche_programme_chauffage"
                name: "Dimanche"
          -
            type: "markdown"
            content: "**Écriture non disponible actuellement.** Les intégrations Alféa M et Cozytouch exposent ces programmes en lecture, sans action d’écriture. Une future version du composant devra ajouter un service dédié avant d’afficher un bouton Enregistrer."
    subview: true
    back_path: "/lovelace-mobile/chauffage-pac"
  -
    title: "Eau chaude"
    path: "chauffage-ecs"
    type: "sections"
    max_columns: 1
    sections:
      -
        type: "grid"
        cards:
          -
            type: "custom:mushroom-title-card"
            title: "Eau chaude"
            subtitle: "Commandes et état du ballon"
          -
            type: "custom:mushroom-entity-card"
            entity: "switch.atlantic_alfea_m_duo_eau_chaude"
            name: "Eau chaude autorisée"
            icon: "mdi:water-boiler"
            tap_action:
              action: "toggle"
          -
            type: "custom:mushroom-entity-card"
            entity: "switch.atlantic_alfea_m_duo_boost_ecs"
            name: "Boost ECS"
            icon: "mdi:fire"
            tap_action:
              action: "toggle"
          -
            type: "horizontal-stack"
            cards:
              -
                type: "custom:mushroom-template-card"
                entity: "sensor.atlantic_alfea_m_duo_temperature_ecs"
                primary: "{{ states('sensor.atlantic_alfea_m_duo_temperature_ecs') }} °C"
                secondary: "Température ECS"
                icon: "mdi:thermometer-water"
              -
                type: "custom:mushroom-template-card"
                entity: "binary_sensor.atlantic_alfea_m_duo_cycle_ecs_capacite_99"
                primary: "{{ 'Actif' if is_state('binary_sensor.atlantic_alfea_m_duo_cycle_ecs_capacite_99', 'on') else 'Inactif' }}"
                secondary: "Cycle ECS"
                icon: "mdi:progress-clock"
                icon_color: "{{ 'deep-orange' if is_state('binary_sensor.atlantic_alfea_m_duo_cycle_ecs_capacite_99', 'on') else 'disabled' }}"
          -
            type: "custom:mushroom-template-card"
            primary: "Plages heures creuses"
            secondary: "00:54–07:24 · 11:54–13:24"
            icon: "mdi:calendar-clock"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-ecs-planning"
          -
            type: "custom:mushroom-template-card"
            primary: "Historique ECS"
            secondary: "Autorisation et température sur trois jours"
            icon: "mdi:chart-line"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-ecs-historique"
    subview: true
    back_path: "/lovelace-mobile/chauffage-v2"
  -
    title: "Planning eau chaude"
    path: "chauffage-ecs-planning"
    type: "sections"
    max_columns: 1
    sections:
      -
        type: "grid"
        cards:
          -
            type: "custom:mushroom-title-card"
            title: "Planning eau chaude"
            subtitle: "Automatisation des heures creuses"
          -
            type: "entities"
            show_header_toggle: false
            entities:
              -
                entity: "automation.gestion_eau_chaude_alfea_heures_creuses"
                name: "Gestion ECS automatique"
          -
            type: "markdown"
            content: >-
              **Nuit :** 00:54 → 07:24  
              **Midi :** 11:54 → 13:24  
              Si un cycle est actif à la fin d’une plage, l’automatisation attend sa fin pendant 90 minutes au maximum avant de couper l’autorisation ECS.
    subview: true
    back_path: "/lovelace-mobile/chauffage-ecs"
  -
    title: "Historique ECS"
    path: "chauffage-ecs-historique"
    type: "sections"
    max_columns: 1
    sections:
      -
        type: "grid"
        cards:
          -
            type: "custom:mushroom-title-card"
            title: "Historique ECS"
            subtitle: "Trois derniers jours"
          -
            type: "history-graph"
            title: "Autorisation et température de l’eau"
            hours_to_show: 72
            entities:
              -
                entity: "switch.atlantic_alfea_m_duo_eau_chaude"
                name: "ECS autorisée"
              -
                entity: "sensor.atlantic_alfea_m_duo_temperature_ecs"
                name: "Température ECS"
          -
            type: "entities"
            show_header_toggle: false
            entities:
              - "binary_sensor.atlantic_alfea_m_duo_cycle_ecs_capacite_99"
              - "sensor.atlantic_alfea_m_duo_consommation_2"
    subview: true
    back_path: "/lovelace-mobile/chauffage-ecs"
  -
    title: "Absence"
    path: "chauffage-absence"
    type: "sections"
    max_columns: 1
    sections:
      -
        type: "grid"
        cards:
          -
            type: "custom:mushroom-title-card"
            title: "Absence"
            subtitle: "Période globale transmise à l’Alféa M"
          -
            type: "entities"
            show_header_toggle: false
            entities:
              -
                entity: "sensor.atlantic_alfea_m_duo_absence"
                name: "État"
              -
                entity: "datetime.atlantic_alfea_m_duo_debut_absence"
                name: "Début"
              -
                entity: "datetime.atlantic_alfea_m_duo_fin_absence"
                name: "Fin"
              -
                entity: "switch.atlantic_alfea_m_duo_absence"
                name: "Activer l’absence"
    subview: true
    back_path: "/lovelace-mobile/chauffage-v2"
  -
    title: "État technique"
    path: "chauffage-pac-technique"
    type: "sections"
    max_columns: 1
    sections:
      -
        type: "grid"
        cards:
          -
            type: "custom:mushroom-title-card"
            title: "État technique"
            subtitle: "Mesures principales de la pompe à chaleur"
          -
            type: "entities"
            show_header_toggle: false
            entities:
              - "sensor.atlantic_alfea_m_duo_pression_deau"
              - "sensor.atlantic_alfea_m_duo_temperature_chaudiere"
              - "sensor.atlantic_alfea_m_duo_temperature_echappement"
              - "sensor.atlantic_alfea_m_duo_temperature_exterieure"
              - "sensor.atlantic_alfea_m_duo_temperature_thermostat_z1"
          -
            type: "custom:mushroom-template-card"
            primary: "Diagnostic et consommations"
            secondary: "Connexion, Wi-Fi, compteurs et identification"
            icon: "mdi:dots-horizontal-circle-outline"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-pac-diagnostic"
    subview: true
    back_path: "/lovelace-mobile/chauffage-pac"
  -
    title: "Diagnostic PAC"
    path: "chauffage-pac-diagnostic"
    type: "sections"
    max_columns: 1
    sections:
      -
        type: "grid"
        cards:
          -
            type: "custom:mushroom-title-card"
            title: "Diagnostic PAC"
          -
            type: "entities"
            show_header_toggle: false
            entities:
              - "binary_sensor.atlantic_alfea_m_duo_connexion_cozytouch"
              - "sensor.atlantic_alfea_m_duo_signal_wi_fi"
              - "sensor.atlantic_alfea_m_duo_zone_1"
              - "binary_sensor.atlantic_alfea_m_duo_cycle_ecs_capacite_99"
              - "binary_sensor.atlantic_alfea_m_duo_mode_boost"
              - "sensor.atlantic_alfea_m_duo_consommation_1"
              - "sensor.atlantic_alfea_m_duo_consommation_2"
              - "sensor.atlantic_alfea_m_duo_modele"
              - "sensor.atlantic_alfea_m_duo_fuseau_horaire"
    subview: true
    back_path: "/lovelace-mobile/chauffage-pac-technique"
  -
    title: "Paramètres chauffage"
    path: "chauffage-parametres"
    subview: true
    back_path: "/lovelace-mobile/chauffage-v2"
    type: "sections"
    max_columns: 1
    sections:
      -
        type: "grid"
        cards:
          -
