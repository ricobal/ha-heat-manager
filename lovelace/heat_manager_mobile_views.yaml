    max_columns: 1
    sections:
      -
        type: "grid"
        cards:
          -
            type: "custom:mushroom-title-card"
            title: "Sous-sol"
            subtitle: "Synthèse de la zone · commandes dans chaque pièce"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-title-card"
            title: "Pièces"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            entity: "climate.radiateur_atelier"
            primary: "Atelier"
            secondary: |-
              {% set current = state_attr('climate.radiateur_atelier', 'current_temperature') %}
              {% set target = state_attr('climate.radiateur_atelier', 'temperature') %}
              {{ (current | round(1) ~ ' °C') if current is number else 'Température indisponible' }} · cible {{ (target | round(1) ~ ' °C') if target is number else '—' }} · {{ {'auto':'Auto','heat':'Chauffage','off':'Éteint'}.get(states('climate.radiateur_atelier'), states('climate.radiateur_atelier')) }}
            icon: "mdi:tools"
            icon_color: "{{ 'deep-orange' if state_attr('climate.radiateur_atelier', 'hvac_action') == 'heating' else 'disabled' }}"
            badge_icon: "{{ 'mdi:alert-circle' if states('climate.radiateur_atelier') in ['unknown', 'unavailable'] else '' }}"
            badge_color: "red"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-piece-atelier"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            entity: "climate.radiateur_salle_cine"
            primary: "Salle ciné"
            secondary: |-
              {% set current = state_attr('climate.radiateur_salle_cine', 'current_temperature') %}
              {% set target = state_attr('climate.radiateur_salle_cine', 'temperature') %}
              {{ (current | round(1) ~ ' °C') if current is number else 'Température indisponible' }} · cible {{ (target | round(1) ~ ' °C') if target is number else '—' }} · {{ {'auto':'Auto','heat':'Chauffage','off':'Éteint'}.get(states('climate.radiateur_salle_cine'), states('climate.radiateur_salle_cine')) }}
            icon: "mdi:movie-open"
            icon_color: "{{ 'deep-orange' if state_attr('climate.radiateur_salle_cine', 'hvac_action') == 'heating' else 'disabled' }}"
            badge_icon: "{{ 'mdi:alert-circle' if states('climate.radiateur_salle_cine') in ['unknown', 'unavailable'] else '' }}"
            badge_color: "red"
            tap_action:
