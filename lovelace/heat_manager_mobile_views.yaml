# Heat Manager mobile v2.1 — vues générées
# Fusionner les éléments de `views` dans le tableau de bord lovelace-mobile après validation.
# Dépendances : Mushroom et card-mod installés et enregistrés dans Lovelace.

views:
  -
    title: "Chauffage"
    path: "chauffage-v2"
    type: "sections"
    max_columns: 1
    sections:
      -
        type: "grid"
        cards:
          -
            type: "custom:mushroom-title-card"
            title: "PAC"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "grid"
            columns: 3
            square: false
            cards:
              -
                type: "button"
                entity: "climate.atlantic_alfea_m_duo_chauffage_circuit_1"
                name: "Marche"
                icon: "mdi:fire"
                show_state: false
                icon_height: "24px"
                tap_action:
                  action: "perform-action"
                  perform_action: "script.chauffage_pac_mode"
                  data:
                    mode: "heat"
                hold_action:
                  action: "none"
                card_mod:
                  style: "ha-card { height: 76px; border-radius: 14px 0 0 14px; box-shadow: none; border: 1px solid var(--divider-color); background: {{ 'rgb(194, 75, 0)' if (is_state('climate.atlantic_alfea_m_duo_chauffage_circuit_1', 'heat') and not is_state('switch.atlantic_alfea_m_duo_absence', 'on')) else 'var(--card-background-color)' }}; color: {{ 'white' if (is_state('climate.atlantic_alfea_m_duo_chauffage_circuit_1', 'heat') and not is_state('switch.atlantic_alfea_m_duo_absence', 'on')) else 'var(--primary-text-color)' }}; --state-icon-color: {{ 'white' if (is_state('climate.atlantic_alfea_m_duo_chauffage_circuit_1', 'heat') and not is_state('switch.atlantic_alfea_m_duo_absence', 'on')) else 'var(--secondary-text-color)' }}; --state-icon-active-color: {{ 'white' if (is_state('climate.atlantic_alfea_m_duo_chauffage_circuit_1', 'heat') and not is_state('switch.atlantic_alfea_m_duo_absence', 'on')) else 'var(--secondary-text-color)' }}; }"
              -
                type: "button"
                entity: "switch.atlantic_alfea_m_duo_absence"
                name: "Absence"
                icon: "mdi:home-export-outline"
                show_state: false
                icon_height: "24px"
                tap_action:
                  action: "perform-action"
                  perform_action: "input_boolean.toggle"
                  target:
                    entity_id: "input_boolean.chauffage_panneau_absence_pac"
                hold_action:
                  action: "none"
                card_mod:
                  style: "ha-card { height: 76px; border-radius: 0; box-shadow: none; border: 1px solid var(--divider-color); background: {{ 'rgb(21, 101, 192)' if is_state('switch.atlantic_alfea_m_duo_absence', 'on') else 'var(--card-background-color)' }}; color: {{ 'white' if is_state('switch.atlantic_alfea_m_duo_absence', 'on') else 'var(--primary-text-color)' }}; --state-icon-color: {{ 'white' if is_state('switch.atlantic_alfea_m_duo_absence', 'on') else 'var(--secondary-text-color)' }}; --state-icon-active-color: {{ 'white' if is_state('switch.atlantic_alfea_m_duo_absence', 'on') else 'var(--secondary-text-color)' }}; {% if is_state('input_boolean.chauffage_panneau_absence_pac', 'on') %}border: 2px solid rgb(21, 101, 192); {% endif %}}"
              -
                type: "button"
                entity: "climate.atlantic_alfea_m_duo_chauffage_circuit_1"
                name: "Arrêt"
                icon: "mdi:power"
                show_state: false
                icon_height: "24px"
                tap_action:
                  action: "perform-action"
                  perform_action: "script.chauffage_pac_mode"
                  data:
                    mode: "off"
                hold_action:
                  action: "none"
                card_mod:
                  style: "ha-card { height: 76px; border-radius: 0 14px 14px 0; box-shadow: none; border: 1px solid var(--divider-color); background: {{ 'rgb(85, 99, 112)' if (is_state('climate.atlantic_alfea_m_duo_chauffage_circuit_1', 'off') and not is_state('switch.atlantic_alfea_m_duo_absence', 'on')) else 'var(--card-background-color)' }}; color: {{ 'white' if (is_state('climate.atlantic_alfea_m_duo_chauffage_circuit_1', 'off') and not is_state('switch.atlantic_alfea_m_duo_absence', 'on')) else 'var(--primary-text-color)' }}; --state-icon-color: {{ 'white' if (is_state('climate.atlantic_alfea_m_duo_chauffage_circuit_1', 'off') and not is_state('switch.atlantic_alfea_m_duo_absence', 'on')) else 'var(--secondary-text-color)' }}; --state-icon-active-color: {{ 'white' if (is_state('climate.atlantic_alfea_m_duo_chauffage_circuit_1', 'off') and not is_state('switch.atlantic_alfea_m_duo_absence', 'on')) else 'var(--secondary-text-color)' }}; }"
            card_mod:
              style: "ha-card { --grid-card-gap: 0px; } :host { --grid-card-gap: 0px; }"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "conditional"
            conditions:
              -
                condition: "state"
                entity: "input_boolean.chauffage_panneau_absence_pac"
                state: "on"
            card:
              type: "entities"
              title: "Absence de la PAC"
              show_header_toggle: false
              entities:
                -
                  entity: "sensor.atlantic_alfea_m_duo_absence"
                  name: "État"
                -
                  entity: "datetime.atlantic_alfea_m_duo_debut_absence"
                  name: "Début"
                -
                  entity: "datetime.atlantic_alfea_m_duo_fin_absence"
                  name: "Fin"
                -
                  entity: "switch.atlantic_alfea_m_duo_absence"
                  name: "Activer l’absence"
                -
                  type: "button"
                  name: "Fermer le panneau"
                  icon: "mdi:close"
                  action_name: "Fermer"
                  tap_action:
                    action: "perform-action"
                    perform_action: "input_boolean.turn_off"
                    target:
                      entity_id: "input_boolean.chauffage_panneau_absence_pac"
              card_mod:
                style: "ha-card { border: 1px solid rgba(21, 101, 192, 0.6); border-left: 4px solid rgb(21, 101, 192); box-shadow: none; }"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "conditional"
            conditions:
              -
                condition: "state"
                entity: "climate.atlantic_alfea_m_duo_chauffage_circuit_1"
                state: "heat"
            card:
              type: "vertical-stack"
              cards:
                -
                  type: "custom:mushroom-template-card"
                  entity: "number.atlantic_alfea_m_duo_temperature_de_consigne"
                  primary: "Consigne générale"
                  secondary: "Température actuelle = {{ states('sensor.atlantic_alfea_m_duo_temperature_thermostat_z1') | replace('.', ',') }} °C"
                  icon: "mdi:thermostat"
                  icon_color: "cyan"
                  tap_action:
                    action: "more-info"
                  hold_action:
                    action: "none"
                  card_mod:
                    style: "ha-card { border: 1px solid rgba(0, 188, 212, 0.45); border-left: 4px solid #00acc1; border-bottom: none; border-radius: 12px 12px 0 0; background: rgba(0, 188, 212, 0.07); box-shadow: none; }"
                -
                  type: "custom:mushroom-number-card"
                  entity: "number.atlantic_alfea_m_duo_temperature_de_consigne"
                  display_mode: "buttons"
                  primary_info: "none"
                  secondary_info: "none"
                  icon_type: "none"
                  card_mod:
                    style: "ha-card { border: 1px solid rgba(0, 188, 212, 0.45); border-left: 4px solid #00acc1; border-top: none; border-radius: 0 0 12px 12px; background: rgba(0, 188, 212, 0.07); box-shadow: none; margin-top: -8px; }"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "horizontal-stack"
            cards:
              -
                type: "custom:mushroom-template-card"
                entity: "sensor.atlantic_alfea_m_duo_temperature_thermostat_z1"
                primary: "{{ states('sensor.atlantic_alfea_m_duo_temperature_thermostat_z1') }} °C"
                secondary: "Temp. intérieure"
                icon: "mdi:home-thermometer-outline"
              -
                type: "custom:mushroom-template-card"
                entity: "sensor.atlantic_alfea_m_duo_temperature_exterieure"
                primary: "{{ states('sensor.atlantic_alfea_m_duo_temperature_exterieure') }} °C"
                secondary: "Temp. extérieure"
                icon: "mdi:thermometer"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            entity: "sensor.atlantic_alfea_m_duo_temperature_ecs"
            primary: "Eau chaude"
            secondary: "{{ states('sensor.atlantic_alfea_m_duo_temperature_ecs') }} °C · {{ 'autorisée' if is_state('switch.atlantic_alfea_m_duo_eau_chaude', 'on') else 'désactivée' }} · cycle {{ 'actif' if is_state('binary_sensor.atlantic_alfea_m_duo_cycle_ecs_capacite_99', 'on') else 'inactif' }}"
            icon: "mdi:water-boiler"
            icon_color: "{{ '#ff6f22' if is_state('binary_sensor.atlantic_alfea_m_duo_cycle_ecs_capacite_99', 'on') else 'cyan' }}"
            badge_icon: "{{ 'mdi:fire' if is_state('binary_sensor.atlantic_alfea_m_duo_cycle_ecs_capacite_99', 'on') else 'mdi:clock-outline' }}"
            badge_color: "{{ 'deep-orange' if is_state('binary_sensor.atlantic_alfea_m_duo_cycle_ecs_capacite_99', 'on') else 'grey' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-ecs"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
            card_mod:
              style: |-
                ha-card {
                  border: 1px solid var(--divider-color);
                  border-radius: 16px;
                  box-shadow: none;
                  min-height: 96px;
                  {% if is_state('binary_sensor.atlantic_alfea_m_duo_cycle_ecs_capacite_99', 'on') %}
                  background: rgb(194, 75, 0);
                  --primary-text-color: white;
                  --secondary-text-color: rgba(255, 255, 255, 0.85);
                  --card-primary-color: white;
                  --card-secondary-color: rgba(255, 255, 255, 0.85);
                  {% endif %}
                }
                ha-state-icon {
                  --mdc-icon-size: 24px;
                }
          -
            type: "custom:mushroom-template-card"
            primary: "État technique"
            secondary: "Pression et températures"
            icon: "mdi:gauge"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-pac-technique"
            grid_options:
              columns: 6
              rows: "auto"
            card_mod:
              style: |-
                ha-card {
                  border: 1px solid var(--divider-color);
                  border-radius: 16px;
                  box-shadow: none;
                  min-height: 96px;
                }
                ha-state-icon {
                  --mdc-icon-size: 24px;
                }
          -
            type: "custom:mushroom-title-card"
            title: "Vannes thermostatiques"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-title-card"
            title: ""
            subtitle: "Contrôle de toutes les vannes"
            card_mod:
              style: "ha-card { margin-top: -16px; }"
            grid_options:
              columns: 8
              rows: "auto"
          -
            type: "custom:mushroom-chips-card"
            alignment: "end"
            chips:
              -
                type: "template"
                content: "Paramètres"
                icon: "mdi:cog-outline"
                tap_action:
                  action: "navigate"
                  navigation_path: "/lovelace-mobile/chauffage-parametres"
            card_mod:
              style: "ha-card { margin-top: -6px; }"
            grid_options:
              columns: 4
              rows: "auto"
          -
            type: "grid"
            columns: 3
            square: false
            cards:
              -
                type: "button"
                entity: "input_select.chauffage_mode_maison"
                name: "Auto"
                icon: "mdi:thermostat-auto"
                show_state: false
                icon_height: "24px"
                tap_action:
                  action: "perform-action"
                  perform_action: "input_select.select_option"
                  data:
                    option: "Auto"
                  target:
                    entity_id: "input_select.chauffage_mode_maison"
                hold_action:
                  action: "none"
                card_mod:
                  style: "ha-card { height: 76px; border-radius: 14px 0 0 14px; box-shadow: none; border: 1px solid var(--divider-color); background: {{ 'rgb(0, 131, 143)' if is_state('input_select.chauffage_mode_maison', 'Auto') else 'var(--card-background-color)' }}; color: {{ 'white' if is_state('input_select.chauffage_mode_maison', 'Auto') else 'var(--primary-text-color)' }}; --state-icon-color: {{ 'white' if is_state('input_select.chauffage_mode_maison', 'Auto') else 'var(--secondary-text-color)' }}; --state-icon-active-color: {{ 'white' if is_state('input_select.chauffage_mode_maison', 'Auto') else 'var(--secondary-text-color)' }}; }"
              -
                type: "button"
                entity: "input_select.chauffage_mode_maison"
                name: "Absence"
                icon: "mdi:home-export-outline"
                show_state: false
                icon_height: "24px"
                tap_action:
                  action: "perform-action"
                  perform_action: "input_select.select_option"
                  data:
                    option: "Absence"
                  target:
                    entity_id: "input_select.chauffage_mode_maison"
                hold_action:
                  action: "none"
                card_mod:
                  style: "ha-card { height: 76px; border-radius: 0; box-shadow: none; border: 1px solid var(--divider-color); background: {{ 'rgb(21, 101, 192)' if is_state('input_select.chauffage_mode_maison', 'Absence') else 'var(--card-background-color)' }}; color: {{ 'white' if is_state('input_select.chauffage_mode_maison', 'Absence') else 'var(--primary-text-color)' }}; --state-icon-color: {{ 'white' if is_state('input_select.chauffage_mode_maison', 'Absence') else 'var(--secondary-text-color)' }}; --state-icon-active-color: {{ 'white' if is_state('input_select.chauffage_mode_maison', 'Absence') else 'var(--secondary-text-color)' }}; }"
              -
                type: "button"
                entity: "input_select.chauffage_mode_maison"
                name: "Arrêt"
                icon: "mdi:power"
                show_state: false
                icon_height: "24px"
                tap_action:
                  action: "perform-action"
                  perform_action: "input_select.select_option"
                  data:
                    option: "Arrêt"
                  target:
                    entity_id: "input_select.chauffage_mode_maison"
                hold_action:
                  action: "none"
                card_mod:
                  style: "ha-card { height: 76px; border-radius: 0 14px 14px 0; box-shadow: none; border: 1px solid var(--divider-color); background: {{ 'rgb(85, 99, 112)' if is_state('input_select.chauffage_mode_maison', 'Arrêt') else 'var(--card-background-color)' }}; color: {{ 'white' if is_state('input_select.chauffage_mode_maison', 'Arrêt') else 'var(--primary-text-color)' }}; --state-icon-color: {{ 'white' if is_state('input_select.chauffage_mode_maison', 'Arrêt') else 'var(--secondary-text-color)' }}; --state-icon-active-color: {{ 'white' if is_state('input_select.chauffage_mode_maison', 'Arrêt') else 'var(--secondary-text-color)' }}; }"
            card_mod:
              style: "ha-card { --grid-card-gap: 0px; } :host { --grid-card-gap: 0px; }"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-title-card"
            title: ""
            subtitle: "Contrôles par pièce"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            entity: "climate.radiateur_parents"
            primary: "Zone parents"
            secondary: |-
              {% set entities = ['climate.radiateur_parents', 'climate.radiateur_dressing', 'climate.radiateur_sdb_parents'] %}
              {% set ns = namespace(total=0, temperatures=[]) %}
              {% for entity in entities %}{% set target = state_attr(entity, 'temperature') %}{% set current = state_attr(entity, 'current_temperature') %}{% if current is number %}{% set ns.temperatures = ns.temperatures + [current] %}{% endif %}{% if states(entity) in ['auto','heat'] and target is number and current is number and target-current > 0.5 %}{% set ns.total = ns.total + 1 %}{% endif %}{% endfor %}
              {% set moyenne = (ns.temperatures | sum / ns.temperatures | count) | round(1) if ns.temperatures | count else none %}{{ ns.total }} sur 3 en demande · {{ moyenne ~ ' °C' if moyenne is not none else 'température indisponible' }}
            icon: "mdi:bed-king-outline"
            icon_color: "{{ 'deep-orange' if expand(['climate.radiateur_parents', 'climate.radiateur_dressing', 'climate.radiateur_sdb_parents']) | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count > 0 else 'disabled' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-zone-parents"
            grid_options:
              columns: "full"
              rows: "auto"
            card_mod:
              style: |-
                ha-card {
                  border: 1px solid var(--divider-color);
                  border-radius: 16px;
                  box-shadow: none;
                  min-height: 72px;
                }
                ha-state-icon {
                  --mdc-icon-size: 24px;
                }
          -
            type: "custom:mushroom-template-card"
            entity: "climate.radiateur_chambre_julie"
            primary: "1er étage"
            secondary: |-
              {% set entities = ['climate.radiateur_chambre_julie', 'climate.radiateur_chambre_pablo', 'climate.radiateur_grande_chambre_amis', 'climate.radiateur_petite_chambre_amis', 'climate.radiateur_chambre_mathias', 'climate.radiateur_sdb_garcons', 'climate.radiateur_sdb_julie'] %}
              {% set ns = namespace(total=0, temperatures=[]) %}
              {% for entity in entities %}{% set target = state_attr(entity, 'temperature') %}{% set current = state_attr(entity, 'current_temperature') %}{% if current is number %}{% set ns.temperatures = ns.temperatures + [current] %}{% endif %}{% if states(entity) in ['auto','heat'] and target is number and current is number and target-current > 0.5 %}{% set ns.total = ns.total + 1 %}{% endif %}{% endfor %}
              {% set moyenne = (ns.temperatures | sum / ns.temperatures | count) | round(1) if ns.temperatures | count else none %}{{ ns.total }} sur 7 en demande · {{ moyenne ~ ' °C' if moyenne is not none else 'température indisponible' }}
            icon: "mdi:home-floor-1"
            icon_color: "{{ 'deep-orange' if expand(['climate.radiateur_chambre_julie', 'climate.radiateur_chambre_pablo', 'climate.radiateur_grande_chambre_amis', 'climate.radiateur_petite_chambre_amis', 'climate.radiateur_chambre_mathias', 'climate.radiateur_sdb_garcons', 'climate.radiateur_sdb_julie']) | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count > 0 else 'disabled' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-zone-premier-etage"
            grid_options:
              columns: "full"
              rows: "auto"
            card_mod:
              style: |-
                ha-card {
                  border: 1px solid var(--divider-color);
                  border-radius: 16px;
                  box-shadow: none;
                  min-height: 72px;
                }
                ha-state-icon {
                  --mdc-icon-size: 24px;
                }
          -
            type: "custom:mushroom-template-card"
            entity: "climate.radiateur_buanderie"
            primary: "Buanderie"
            secondary: |-
              {% set entities = ['climate.radiateur_buanderie'] %}
              {% set ns = namespace(total=0, temperatures=[]) %}
              {% for entity in entities %}{% set target = state_attr(entity, 'temperature') %}{% set current = state_attr(entity, 'current_temperature') %}{% if current is number %}{% set ns.temperatures = ns.temperatures + [current] %}{% endif %}{% if states(entity) in ['auto','heat'] and target is number and current is number and target-current > 0.5 %}{% set ns.total = ns.total + 1 %}{% endif %}{% endfor %}
              {% set moyenne = (ns.temperatures | sum / ns.temperatures | count) | round(1) if ns.temperatures | count else none %}{{ ns.total }} sur 1 en demande · {{ moyenne ~ ' °C' if moyenne is not none else 'température indisponible' }}
            icon: "mdi:washing-machine"
            icon_color: "{{ 'deep-orange' if expand(['climate.radiateur_buanderie']) | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count > 0 else 'disabled' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-piece-buanderie"
            grid_options:
              columns: "full"
              rows: "auto"
            card_mod:
              style: |-
                ha-card {
                  border: 1px solid var(--divider-color);
                  border-radius: 16px;
                  box-shadow: none;
                  min-height: 72px;
                }
                ha-state-icon {
                  --mdc-icon-size: 24px;
                }
          -
            type: "custom:mushroom-template-card"
            entity: "climate.radiateur_atelier"
            primary: "Sous-sol"
            secondary: |-
              {% set entities = ['climate.radiateur_atelier', 'climate.radiateur_salle_cine'] %}
              {% set ns = namespace(total=0, temperatures=[]) %}
              {% for entity in entities %}{% set target = state_attr(entity, 'temperature') %}{% set current = state_attr(entity, 'current_temperature') %}{% if current is number %}{% set ns.temperatures = ns.temperatures + [current] %}{% endif %}{% if states(entity) in ['auto','heat'] and target is number and current is number and target-current > 0.5 %}{% set ns.total = ns.total + 1 %}{% endif %}{% endfor %}
              {% set moyenne = (ns.temperatures | sum / ns.temperatures | count) | round(1) if ns.temperatures | count else none %}{{ ns.total }} sur 2 en demande · {{ moyenne ~ ' °C' if moyenne is not none else 'température indisponible' }}
            icon: "mdi:home-floor-negative-1"
            icon_color: "{{ 'deep-orange' if expand(['climate.radiateur_atelier', 'climate.radiateur_salle_cine']) | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count > 0 else 'disabled' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/chauffage-zone-sous-sol"
            grid_options:
              columns: "full"
              rows: "auto"
            card_mod:
              style: |-
                ha-card {
                  border: 1px solid var(--divider-color);
                  border-radius: 16px;
                  box-shadow: none;
                  min-height: 72px;
                }
                ha-state-icon {
                  --mdc-icon-size: 24px;
                }
          -
            type: "custom:mushroom-template-card"
            entity: "binary_sensor.chauffage_demande_chauffage"
            primary: "Vannes thermostatiques · {{ states('input_select.chauffage_mode_maison') }}"
            secondary: "{{ state_attr('binary_sensor.chauffage_demande_chauffage', 'nombre_pieces_en_demande') | int(0) }} pièces demandent du chauffage · écart max. {{ state_attr('binary_sensor.chauffage_demande_chauffage', 'ecart_maximum') | float(0) }} °C"
            icon: "mdi:radiator"
            icon_color: "{{ 'deep-orange' if is_state('binary_sensor.chauffage_demande_chauffage', 'on') else 'disabled' }}"
