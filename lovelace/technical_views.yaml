# Paramètres techniques — vues générées par tools/generate_technical_dashboard.py
# Remplacer les vues technique* du tableau de bord lovelace-mobile après validation.
# La carte d'accès de l'accueil est HOME_CARD dans le générateur.

views:
  -
    title: "Paramètres techniques"
    path: "technique"
    type: "sections"
    max_columns: 1
    sections:
      -
        type: "grid"
        cards:
          -
            type: "custom:mushroom-chips-card"
            chips:
              -
                type: "back"
              -
                type: "action"
                tap_action:
                  action: "navigate"
                  navigation_path: "/lovelace-mobile/0"
                icon: "mdi:home"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-title-card"
            title: "Paramètres techniques"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "conditional"
            conditions:
              -
                condition: "state"
                entity: "sensor.resume_technique"
                state: "alerte"
            card:
              type: "custom:mushroom-template-card"
              entity: "sensor.resume_technique"
              primary: "À traiter"
              secondary: "{{ state_attr('sensor.resume_technique', 'alertes') | join('\\n') }}"
              multiline_secondary: true
              icon: "mdi:alert"
              icon_color: "red"
              card_mod:
                style: "ha-card { background: #FCEBEB; --primary-text-color: #791F1F; --secondary-text-color: #A32D2D; }"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Serveur HA"
            secondary: "CPU {{ states('sensor.home_assistant_core_pourcentage_du_processeur') | float(0) | round(0) }} % · disque {{ states('sensor.disque_serveur_ha_utilise') }} %"
            icon: "mdi:home-assistant"
            icon_color: "{{ 'green' if states('sensor.disque_serveur_ha_utilise') | float(0) <= 85 else 'orange' if false else 'red' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/technique-serveur"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "NAS"
            secondary: "{{ 'Normal' if is_state('sensor.nas_eric_status', 'normal') else states('sensor.nas_eric_status') }} · {{ states('sensor.nas_eric_volume_used') | float(0) | round(0) }} %"
            icon: "mdi:nas"
            icon_color: "{{ 'green' if is_state('sensor.nas_eric_status', 'normal') and states('sensor.nas_eric_volume_used') | float(0) <= 85 else 'orange' if false else 'red' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/technique-nas"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Onduleur"
            secondary: "{{ 'Secteur' if states('sensor.ups_code_d_etat').startswith('OL') else 'Sur batterie' }} · {{ (states('sensor.ups_autonomie_de_la_batterie') | float(0) / 60) | round(0) }} min"
            icon: "mdi:power-plug-battery"
            icon_color: "{{ 'green' if states('sensor.ups_code_d_etat').startswith('OL') else 'orange' if false else 'red' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/technique-onduleur"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Batteries"
            secondary: "{% set n = states('sensor.batteries_zigbee_faibles') | int(0) %}{{ 'Toutes OK' if n == 0 else n ~ ' à remplacer' }}"
            icon: "mdi:battery-heart-variant"
            icon_color: "{{ 'green' if states('sensor.batteries_zigbee_faibles') | int(0) == 0 else 'orange' if false else 'red' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/technique-batteries"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Zigbee"
            secondary: "{{ 'Connecté' if is_state('binary_sensor.zigbee2mqtt_bridge_connection_state', 'on') else 'Déconnecté' }} · {{ states('sensor.appareils_zigbee_indisponibles') }} hors ligne"
            icon: "mdi:zigbee"
            icon_color: "{{ 'green' if is_state('binary_sensor.zigbee2mqtt_bridge_connection_state', 'on') and states('sensor.appareils_zigbee_indisponibles') | int(0) == 0 else 'orange' if is_state('binary_sensor.zigbee2mqtt_bridge_connection_state', 'on') else 'red' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/technique-zigbee"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Mises à jour"
            secondary: "{% set n = states('sensor.mises_a_jour_en_attente') | int(0) %}{{ 'À jour' if n == 0 else n ~ ' en attente' }}"
            icon: "mdi:package-up"
            icon_color: "{{ 'green' if states('sensor.mises_a_jour_en_attente') | int(0) == 0 else 'orange' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/technique-mises-a-jour"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Sauvegardes"
            secondary: "{% set t = state_attr('sensor.backup_state', 'last_backup') %}{{ 'Dernière ' ~ (as_datetime(t) | as_local).strftime('%d/%m %H:%M') if t else states('sensor.backup_state') }}"
            icon: "mdi:cloud-upload"
            icon_color: "{{ 'red' if is_state('binary_sensor.backups_stale', 'on') else 'green' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/technique-sauvegardes"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Santé config"
            secondary: "{% set w = states('sensor.watchman_missing_entities') | int(0) %}{{ 'Aucune anomalie' if w == 0 else w ~ ' entités manquantes' }}"
            icon: "mdi:stethoscope"
            icon_color: "{{ 'green' if states('sensor.watchman_missing_entities') | int(0) == 0 else 'orange' }}"
            tap_action:
              action: "navigate"
              navigation_path: "/lovelace-mobile/technique-sante"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
    background: "#e4e9f0"
    visible: false
    icon: "mdi:server"
  -
    title: "Serveur HA"
    path: "technique-serveur"
    type: "sections"
    max_columns: 1
    sections:
      -
        type: "grid"
        cards:
          -
            type: "custom:mushroom-chips-card"
            chips:
              -
                type: "back"
              -
                type: "action"
                tap_action:
                  action: "navigate"
                  navigation_path: "/lovelace-mobile/0"
                icon: "mdi:home"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-title-card"
            title: "Serveur HA"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-title-card"
            subtitle: "Ressources de la VM"
          -
            type: "custom:bar-card"
            entities:
              -
                entity: "sensor.home_assistant_core_pourcentage_du_processeur"
                name: "CPU Home Assistant"
              -
                entity: "sensor.home_assistant_core_pourcentage_de_memoire"
                name: "Mémoire Home Assistant"
              -
                entity: "sensor.disque_serveur_ha_utilise"
                name: "Disque"
            positions:
              icon: "off"
              indicator: "off"
            height: 26
            max: 100
            severity:
              -
                from: 0
                to: 70
