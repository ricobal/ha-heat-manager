              -
                from: 70
                to: 85
                color: "#EF9F27"
              -
                from: 85
                to: 100
                color: "#E24B4A"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Disque"
            secondary: "{{ states('sensor.home_assistant_host_taille_du_disque_utilise') }} Go utilisés sur {{ states('sensor.home_assistant_host_taille_total_du_disque') }} Go · {{ states('sensor.home_assistant_host_taille_du_disque_libre') }} Go libres"
            icon: "mdi:harddisk"
            icon_color: "blue"
            entity: "sensor.home_assistant_host_taille_du_disque_libre"
            tap_action:
              action: "more-info"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-title-card"
            subtitle: "Versions"
          -
            type: "custom:mushroom-template-card"
            primary: "Core HA"
            secondary: "{{ state_attr('update.home_assistant_core_update', 'installed_version') }}{{ ' → ' ~ state_attr('update.home_assistant_core_update', 'latest_version') if is_state('update.home_assistant_core_update', 'on') }}"
            icon: "mdi:home-assistant"
            icon_color: "{{ 'orange' if is_state('update.home_assistant_core_update', 'on') else 'green' }}"
            entity: "update.home_assistant_core_update"
            tap_action:
              action: "more-info"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Système (OS)"
            secondary: "{{ state_attr('update.home_assistant_operating_system_update', 'installed_version') }}{{ ' → ' ~ state_attr('update.home_assistant_operating_system_update', 'latest_version') if is_state('update.home_assistant_operating_system_update', 'on') }}"
            icon: "mdi:linux"
            icon_color: "{{ 'orange' if is_state('update.home_assistant_operating_system_update', 'on') else 'green' }}"
            entity: "update.home_assistant_operating_system_update"
            tap_action:
              action: "more-info"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Supervisor"
            secondary: "{{ state_attr('update.home_assistant_supervisor_update', 'installed_version') }}"
            icon: "mdi:cog-outline"
            icon_color: "{{ 'orange' if is_state('update.home_assistant_supervisor_update', 'on') else 'green' }}"
            entity: "update.home_assistant_supervisor_update"
            tap_action:
              action: "more-info"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Accès distant"
            secondary: "{{ 'Nabu Casa actif' if is_state('binary_sensor.remote_ui', 'on') else 'Inactif' }}"
            icon: "mdi:cloud-lock-outline"
            icon_color: "{{ 'green' if is_state('binary_sensor.remote_ui', 'on') else 'red' }}"
            entity: "binary_sensor.remote_ui"
            tap_action:
              action: "more-info"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-title-card"
            subtitle: "Modules complémentaires"
          -
            type: "custom:mushroom-template-card"
            primary: "Zigbee2MQTT"
            secondary: "{{ 'En marche' if is_state('binary_sensor.zigbee2mqtt_en_cours_d_execution', 'on') else 'Arrêté' }}"
            icon: "mdi:zigbee"
            icon_color: "{{ 'green' if is_state('binary_sensor.zigbee2mqtt_en_cours_d_execution', 'on') else 'red' }}"
            entity: "binary_sensor.zigbee2mqtt_en_cours_d_execution"
            tap_action:
              action: "more-info"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Mosquitto"
            secondary: "{{ 'En marche' if is_state('binary_sensor.mosquitto_broker_en_cours_d_execution', 'on') else 'Arrêté' }}"
            icon: "mdi:message-processing-outline"
            icon_color: "{{ 'green' if is_state('binary_sensor.mosquitto_broker_en_cours_d_execution', 'on') else 'red' }}"
            entity: "binary_sensor.mosquitto_broker_en_cours_d_execution"
            tap_action:
              action: "more-info"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
    background: "#e4e9f0"
    visible: false
    icon: "mdi:home-assistant"
  -
    title: "NAS Synology"
    path: "technique-nas"
    type: "sections"
    max_columns: 1
    sections:
      -
        type: "grid"
        cards:
          -
            type: "custom:mushroom-chips-card"
            chips:
              -
                type: "back"
              -
                type: "action"
                tap_action:
                  action: "navigate"
                  navigation_path: "/lovelace-mobile/0"
                icon: "mdi:home"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-title-card"
            title: "NAS Synology"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "État"
            secondary: "{{ 'Normal' if is_state('sensor.nas_eric_status', 'normal') else states('sensor.nas_eric_status') }} · DSM {{ 'à mettre à jour' if is_state('update.nas_eric_dsm_update', 'on') else 'à jour' }}"
            icon: "mdi:nas"
            icon_color: "{{ 'green' if is_state('sensor.nas_eric_status', 'normal') else 'red' }}"
            entity: "sensor.nas_eric_status"
            tap_action:
              action: "more-info"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-title-card"
            subtitle: "Ressources"
          -
            type: "custom:bar-card"
            entities:
              -
                entity: "sensor.nas_eric_cpu_utilization_total"
                name: "CPU"
              -
                entity: "sensor.nas_eric_memory_usage_real"
                name: "Mémoire"
              -
                entity: "sensor.nas_eric_volume_used"
                name: "Volume"
              -
                entity: "sensor.nas_eric_usb_disk_1_partition_1_partition_utilisee"
                name: "Disque USB"
            positions:
              icon: "off"
              indicator: "off"
            height: 26
            max: 100
            severity:
              -
                from: 0
                to: 70
                color: "#639922"
              -
                from: 70
                to: 85
                color: "#EF9F27"
              -
                from: 85
                to: 100
                color: "#E24B4A"
            grid_options:
              columns: "full"
              rows: "auto"
          -
            type: "custom:mushroom-title-card"
            subtitle: "Disques"
          -
            type: "custom:mushroom-template-card"
            primary: "Disque 1"
            secondary: "{{ states('sensor.nas_eric_temperature') }} °C · {{ 'normal' if is_state('sensor.nas_eric_status', 'normal') else states('sensor.nas_eric_status') }}"
            icon: "mdi:harddisk"
            icon_color: "{{ 'green' if is_state('sensor.nas_eric_status', 'normal') and states('sensor.nas_eric_temperature') | float(0) < 50 else 'red' }}"
            entity: "sensor.nas_eric_temperature"
            tap_action:
              action: "more-info"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Disque 2"
            secondary: "{{ states('sensor.nas_eric_temperature_2') }} °C · {{ 'normal' if is_state('sensor.nas_eric_status_2', 'normal') else states('sensor.nas_eric_status_2') }}"
            icon: "mdi:harddisk"
            icon_color: "{{ 'green' if is_state('sensor.nas_eric_status_2', 'normal') and states('sensor.nas_eric_temperature_2') | float(0) < 50 else 'red' }}"
            entity: "sensor.nas_eric_temperature_2"
            tap_action:
              action: "more-info"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Disque 3"
            secondary: "{{ states('sensor.nas_eric_temperature_3') }} °C · {{ 'normal' if is_state('sensor.nas_eric_status_3', 'normal') else states('sensor.nas_eric_status_3') }}"
            icon: "mdi:harddisk"
            icon_color: "{{ 'green' if is_state('sensor.nas_eric_status_3', 'normal') and states('sensor.nas_eric_temperature_3') | float(0) < 50 else 'red' }}"
            entity: "sensor.nas_eric_temperature_3"
            tap_action:
              action: "more-info"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Santé disques"
            secondary: "{{ 'Aucun secteur défectueux, durée de vie OK' if is_state('binary_sensor.nas_eric_exceeded_max_bad_sectors', 'off') and is_state('binary_sensor.nas_eric_exceeded_max_bad_sectors_2', 'off') and is_state('binary_sensor.nas_eric_below_min_remaining_life', 'off') and is_state('binary_sensor.nas_eric_below_min_remaining_life_2', 'off') else 'Problème détecté' }}"
            icon: "mdi:heart-pulse"
            icon_color: "{{ 'green' if is_state('binary_sensor.nas_eric_exceeded_max_bad_sectors', 'off') and is_state('binary_sensor.nas_eric_exceeded_max_bad_sectors_2', 'off') and is_state('binary_sensor.nas_eric_below_min_remaining_life', 'off') and is_state('binary_sensor.nas_eric_below_min_remaining_life_2', 'off') else 'red' }}"
            entity: "binary_sensor.nas_eric_exceeded_max_bad_sectors"
            tap_action:
              action: "more-info"
            multiline_secondary: true
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-title-card"
            subtitle: "Actions"
          -
            type: "custom:mushroom-template-card"
            primary: "Redémarrer"
            secondary: "Appui long"
            icon: "mdi:restart"
            icon_color: "orange"
            entity: "button.nas_eric_reboot"
            tap_action:
              action: "none"
            hold_action:
              action: "perform-action"
              perform_action: "button.press"
              target:
                entity_id: "button.nas_eric_reboot"
              confirmation:
                text: "Redémarrer le NAS ? Home Assistant (VM) sera arrêté pendant le redémarrage."
            grid_options:
              columns: 6
              rows: "auto"
          -
            type: "custom:mushroom-template-card"
            primary: "Éteindre"
            secondary: "Appui long"
            icon: "mdi:power"
            icon_color: "red"
            entity: "button.nas_eric_shutdown"
            tap_action:
              action: "none"
            hold_action:
              action: "perform-action"
              perform_action: "button.press"
              target:
                entity_id: "button.nas_eric_shutdown"
              confirmation:
                text: "Éteindre le NAS ? Home Assistant (VM) s'arrêtera et ne redémarrera pas seul."
            grid_options:
              columns: 6
              rows: "auto"
    background: "#e4e9f0"
    visible: false
    icon: "mdi:nas"
