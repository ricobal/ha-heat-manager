# Heat Manager TRVZB v2.1.0-beta.2
# À placer dans /config/packages/heat_manager_trvzb.yaml
# Les helpers existants restaurent leur dernier état : ne pas ajouter initial.
# Les valeurs de référence ci-dessous ne sont pas des valeurs par défaut actives.
# Sur une installation neuve, renseigner les helpers avant utilisation.
# Aucun envoi automatique aux vannes au démarrage ou au retour de disponibilité.

input_number:
  chauffage_profil_absence:
    name: Profil chauffage. Absence
    min: 7
    max: 18
    step: 0.5
    unit_of_measurement: "°C"
    # Valeur de référence (état restauré au démarrage) : 12
    icon: mdi:home-export-outline
  chauffage_profil_nuit:
    name: Profil chauffage. Nuit
    min: 10
    max: 22
    step: 0.5
    unit_of_measurement: "°C"
    # Valeur de référence (état restauré au démarrage) : 17
    icon: mdi:weather-night
  chauffage_profil_confort:
    name: Profil chauffage. Confort
    min: 12
    max: 25
    step: 0.5
    unit_of_measurement: "°C"
    # Valeur de référence (état restauré au démarrage) : 19
    icon: mdi:home-thermometer
  chauffage_duree_boost:
    name: Durée du boost
    min: 5
    max: 180
    step: 5
    unit_of_measurement: min
    # Valeur de référence (état restauré au démarrage) : 30
    icon: mdi:timer-outline

input_select:
  chauffage_mode_maison:
    name: Mode chauffage maison
    options:
      - Auto
      - Confort
      - Nuit
      - Absence
      - Arrêt
    # Valeur de référence (état restauré au démarrage) : Auto
    icon: mdi:home-thermometer-outline

