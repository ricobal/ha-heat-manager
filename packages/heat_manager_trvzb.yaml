template:
  - sensor:
      - name: Chauffage. Synthèse maison
        unique_id: chauffage_synthese_maison
        icon: mdi:radiator
        state: >-
          {% set e = ['climate.radiateur_chambre_julie', 'climate.radiateur_chambre_pablo', 'climate.radiateur_grande_chambre_amis', 'climate.radiateur_petite_chambre_amis', 'climate.radiateur_chambre_mathias', 'climate.radiateur_sdb_garcons', 'climate.radiateur_sdb_julie', 'climate.radiateur_parents', 'climate.radiateur_dressing', 'climate.radiateur_sdb_parents', 'climate.radiateur_atelier', 'climate.radiateur_salle_cine', 'climate.radiateur_buanderie'] %}
          {% set ns = namespace(t=[], chauffe=0, indispo=0) %}
          {% for x in e %}
            {% set v = state_attr(x, 'current_temperature') %}
            {% if v is number %}{% set ns.t = ns.t + [v] %}{% endif %}
            {% if state_attr(x, 'hvac_action') == 'heating' %}{% set ns.chauffe = ns.chauffe + 1 %}{% endif %}
            {% if states(x) in ['unknown','unavailable'] %}{% set ns.indispo = ns.indispo + 1 %}{% endif %}
          {% endfor %}
          {{ ((ns.t | sum / ns.t | count) | round(1)) if ns.t | count else none }}
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        attributes:
          radiateurs_en_chauffe: >-
            {{ expand('climate.radiateur_chambre_julie', 'climate.radiateur_chambre_pablo', 'climate.radiateur_grande_chambre_amis', 'climate.radiateur_petite_chambre_amis', 'climate.radiateur_chambre_mathias', 'climate.radiateur_sdb_garcons', 'climate.radiateur_sdb_julie', 'climate.radiateur_parents', 'climate.radiateur_dressing', 'climate.radiateur_sdb_parents', 'climate.radiateur_atelier', 'climate.radiateur_salle_cine', 'climate.radiateur_buanderie') | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count }}
          radiateurs_indisponibles: >-
            {{ expand('climate.radiateur_chambre_julie', 'climate.radiateur_chambre_pablo', 'climate.radiateur_grande_chambre_amis', 'climate.radiateur_petite_chambre_amis', 'climate.radiateur_chambre_mathias', 'climate.radiateur_sdb_garcons', 'climate.radiateur_sdb_julie', 'climate.radiateur_parents', 'climate.radiateur_dressing', 'climate.radiateur_sdb_parents', 'climate.radiateur_atelier', 'climate.radiateur_salle_cine', 'climate.radiateur_buanderie') | selectattr('state', 'in', ['unknown','unavailable']) | list | count }}
          batterie_minimum: >-
            {% set b = ['sensor.radiateur_chambre_julie_battery', 'sensor.radiateur_chambre_pablo_battery', 'sensor.radiateur_grande_chambre_amis_battery', 'sensor.radiateur_petite_chambre_amis_battery', 'sensor.radiateur_chambre_mathias_battery', 'sensor.radiateur_sdb_garcons_battery', 'sensor.radiateur_sdb_julie_battery', 'sensor.radiateur_parents_battery', 'sensor.radiateur_dressing_battery', 'sensor.radiateur_sdb_parents_battery', 'sensor.radiateur_atelier_battery', 'sensor.radiateur_salle_cine_battery', 'sensor.radiateur_buanderie_battery'] | map('states') | map('float', none) | reject('eq', none) | list %}
            {{ b | min if b | count else none }}
          mode_maison: "{{ states('input_select.chauffage_mode_maison') }}"
      - name: Chauffage. Chambres inoccupées
        unique_id: chauffage_chambres_inoccupees_resume
        icon: mdi:bed-empty
        state: >-
          {% set e = ['climate.radiateur_chambre_julie', 'climate.radiateur_chambre_pablo', 'climate.radiateur_grande_chambre_amis', 'climate.radiateur_petite_chambre_amis'] %}
          {% set ns = namespace(t=[], chauffe=0) %}
          {% for x in e %}
            {% set v = state_attr(x, 'current_temperature') %}
            {% if v is number %}{% set ns.t = ns.t + [v] %}{% endif %}
            {% if state_attr(x, 'hvac_action') == 'heating' %}{% set ns.chauffe = ns.chauffe + 1 %}{% endif %}
          {% endfor %}
          {{ ((ns.t | sum / ns.t | count) | round(1)) if ns.t | count else none }}
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        attributes:
          en_chauffe: >-
            {{ expand('climate.radiateur_chambre_julie', 'climate.radiateur_chambre_pablo', 'climate.radiateur_grande_chambre_amis', 'climate.radiateur_petite_chambre_amis') | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count }}
          nombre_vannes: 4
          batterie_minimum: >-
            {% set b = ['sensor.radiateur_chambre_julie_battery', 'sensor.radiateur_chambre_pablo_battery', 'sensor.radiateur_grande_chambre_amis_battery', 'sensor.radiateur_petite_chambre_amis_battery'] | map('states') | map('float', none) | reject('eq', none) | list %}
            {{ b | min if b | count else none }}
          mode: >-
            {% set s = expand('climate.radiateur_chambre_julie', 'climate.radiateur_chambre_pablo', 'climate.radiateur_grande_chambre_amis', 'climate.radiateur_petite_chambre_amis') | map(attribute='state') | unique | list %}
            {{ s[0] if s | count == 1 else 'mixte' }}
      - name: Chauffage. Chambre Mathias
        unique_id: chauffage_chambre_mathias_resume
        icon: mdi:bed
        state: >-
          {% set e = ['climate.radiateur_chambre_mathias'] %}
          {% set ns = namespace(t=[], chauffe=0) %}
          {% for x in e %}
            {% set v = state_attr(x, 'current_temperature') %}
            {% if v is number %}{% set ns.t = ns.t + [v] %}{% endif %}
            {% if state_attr(x, 'hvac_action') == 'heating' %}{% set ns.chauffe = ns.chauffe + 1 %}{% endif %}
          {% endfor %}
          {{ ((ns.t | sum / ns.t | count) | round(1)) if ns.t | count else none }}
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        attributes:
          en_chauffe: >-
            {{ expand('climate.radiateur_chambre_mathias') | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count }}
          nombre_vannes: 1
          batterie_minimum: >-
            {% set b = ['sensor.radiateur_chambre_mathias_battery'] | map('states') | map('float', none) | reject('eq', none) | list %}
            {{ b | min if b | count else none }}
          mode: >-
            {% set s = expand('climate.radiateur_chambre_mathias') | map(attribute='state') | unique | list %}
            {{ s[0] if s | count == 1 else 'mixte' }}
      - name: Chauffage. SDB garçons
        # Identifiant historique conservé pour éviter un doublon dans le registre.
        unique_id: chauffage_sdb_mathias_resume
        icon: mdi:shower-head
        state: >-
          {% set e = ['climate.radiateur_sdb_garcons'] %}
