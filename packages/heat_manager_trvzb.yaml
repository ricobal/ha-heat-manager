          {% endfor %}
          {{ ((ns.t | sum / ns.t | count) | round(1)) if ns.t | count else none }}
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        attributes:
          en_chauffe: >-
            {{ expand('climate.radiateur_sdb_parents') | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count }}
          nombre_vannes: 1
          batterie_minimum: >-
            {% set b = ['sensor.radiateur_sdb_parents_battery'] | map('states') | map('float', none) | reject('eq', none) | list %}
            {{ b | min if b | count else none }}
          mode: >-
            {% set s = expand('climate.radiateur_sdb_parents') | map(attribute='state') | unique | list %}
            {{ s[0] if s | count == 1 else 'mixte' }}
      - name: Chauffage. Sous-sol
        unique_id: chauffage_sous_sol_resume
        icon: mdi:home-floor-negative-1
        state: >-
          {% set e = ['climate.radiateur_atelier', 'climate.radiateur_salle_cine'] %}
          {% set ns = namespace(t=[], chauffe=0) %}
          {% for x in e %}
            {% set v = state_attr(x, 'current_temperature') %}
            {% if v is number %}{% set ns.t = ns.t + [v] %}{% endif %}
            {% if state_attr(x, 'hvac_action') == 'heating' %}{% set ns.chauffe = ns.chauffe + 1 %}{% endif %}
          {% endfor %}
          {{ ((ns.t | sum / ns.t | count) | round(1)) if ns.t | count else none }}
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        attributes:
          en_chauffe: >-
            {{ expand('climate.radiateur_atelier', 'climate.radiateur_salle_cine') | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count }}
          nombre_vannes: 2
          batterie_minimum: >-
            {% set b = ['sensor.radiateur_atelier_battery', 'sensor.radiateur_salle_cine_battery'] | map('states') | map('float', none) | reject('eq', none) | list %}
            {{ b | min if b | count else none }}
          mode: >-
            {% set s = expand('climate.radiateur_atelier', 'climate.radiateur_salle_cine') | map(attribute='state') | unique | list %}
            {{ s[0] if s | count == 1 else 'mixte' }}
      - name: Chauffage. Buanderie
        unique_id: chauffage_buanderie_resume
        icon: mdi:washing-machine
        state: >-
          {% set e = ['climate.radiateur_buanderie'] %}
          {% set ns = namespace(t=[], chauffe=0) %}
          {% for x in e %}
            {% set v = state_attr(x, 'current_temperature') %}
            {% if v is number %}{% set ns.t = ns.t + [v] %}{% endif %}
            {% if state_attr(x, 'hvac_action') == 'heating' %}{% set ns.chauffe = ns.chauffe + 1 %}{% endif %}
          {% endfor %}
          {{ ((ns.t | sum / ns.t | count) | round(1)) if ns.t | count else none }}
        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        attributes:
          en_chauffe: >-
            {{ expand('climate.radiateur_buanderie') | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count }}
          nombre_vannes: 1
          batterie_minimum: >-
            {% set b = ['sensor.radiateur_buanderie_battery'] | map('states') | map('float', none) | reject('eq', none) | list %}
            {{ b | min if b | count else none }}
          mode: >-
            {% set s = expand('climate.radiateur_buanderie') | map(attribute='state') | unique | list %}
            {{ s[0] if s | count == 1 else 'mixte' }}
  - binary_sensor:
      - name: Chauffage. Demande chauffage
        unique_id: chauffage_demande_chauffage
        icon: mdi:radiator
        delay_on: "00:15:00"
        state: >-
          {% set vannes = [
            'climate.radiateur_chambre_julie',
            'climate.radiateur_chambre_pablo',
            'climate.radiateur_grande_chambre_amis',
            'climate.radiateur_petite_chambre_amis',
            'climate.radiateur_chambre_mathias',
            'climate.radiateur_sdb_garcons',
            'climate.radiateur_sdb_julie',
            'climate.radiateur_parents',
            'climate.radiateur_dressing',
            'climate.radiateur_sdb_parents',
            'climate.radiateur_atelier',
            'climate.radiateur_salle_cine',
            'climate.radiateur_buanderie'
          ] %}
          {% set ns = namespace(demande=0) %}
          {% for vanne in vannes %}
            {% set cible = state_attr(vanne, 'temperature') %}
            {% set mesure = state_attr(vanne, 'current_temperature') %}
            {% if states(vanne) in ['auto', 'heat'] and cible is number and mesure is number and cible - mesure > 0.5 %}
              {% set ns.demande = ns.demande + 1 %}
            {% endif %}
          {% endfor %}
          {{ ns.demande > 0 }}
        attributes:
          seuil_ecart: 0.5
          temporisation_minutes: 15
          nombre_pieces_en_demande: >-
            {% set vannes = [
              'climate.radiateur_chambre_julie', 'climate.radiateur_chambre_pablo',
              'climate.radiateur_grande_chambre_amis', 'climate.radiateur_petite_chambre_amis',
              'climate.radiateur_chambre_mathias', 'climate.radiateur_sdb_garcons',
              'climate.radiateur_sdb_julie', 'climate.radiateur_parents',
              'climate.radiateur_dressing', 'climate.radiateur_sdb_parents',
              'climate.radiateur_atelier', 'climate.radiateur_salle_cine',
              'climate.radiateur_buanderie'
            ] %}
            {% set ns = namespace(total=0) %}
            {% for vanne in vannes %}
              {% set cible = state_attr(vanne, 'temperature') %}
              {% set mesure = state_attr(vanne, 'current_temperature') %}
              {% if states(vanne) in ['auto', 'heat'] and cible is number and mesure is number and cible - mesure > 0.5 %}
                {% set ns.total = ns.total + 1 %}
              {% endif %}
            {% endfor %}
            {{ ns.total }}
          nombre_pieces_forte_demande: >-
            {% set vannes = [
              'climate.radiateur_chambre_julie', 'climate.radiateur_chambre_pablo',
              'climate.radiateur_grande_chambre_amis', 'climate.radiateur_petite_chambre_amis',
              'climate.radiateur_chambre_mathias', 'climate.radiateur_sdb_garcons',
              'climate.radiateur_sdb_julie', 'climate.radiateur_parents',
              'climate.radiateur_dressing', 'climate.radiateur_sdb_parents',
              'climate.radiateur_atelier', 'climate.radiateur_salle_cine',
              'climate.radiateur_buanderie'
            ] %}
            {% set ns = namespace(total=0) %}
            {% for vanne in vannes %}
              {% set cible = state_attr(vanne, 'temperature') %}
              {% set mesure = state_attr(vanne, 'current_temperature') %}
              {% if states(vanne) in ['auto', 'heat'] and cible is number and mesure is number and cible - mesure > 1 %}
                {% set ns.total = ns.total + 1 %}
              {% endif %}
            {% endfor %}
            {{ ns.total }}
          ecart_maximum: >-
            {% set vannes = [
              'climate.radiateur_chambre_julie', 'climate.radiateur_chambre_pablo',
              'climate.radiateur_grande_chambre_amis', 'climate.radiateur_petite_chambre_amis',
              'climate.radiateur_chambre_mathias', 'climate.radiateur_sdb_garcons',
              'climate.radiateur_sdb_julie', 'climate.radiateur_parents',
              'climate.radiateur_dressing', 'climate.radiateur_sdb_parents',
              'climate.radiateur_atelier', 'climate.radiateur_salle_cine',
              'climate.radiateur_buanderie'
            ] %}
            {% set ns = namespace(ecarts=[]) %}
            {% for vanne in vannes %}
              {% set cible = state_attr(vanne, 'temperature') %}
              {% set mesure = state_attr(vanne, 'current_temperature') %}
              {% if states(vanne) in ['auto', 'heat'] and cible is number and mesure is number %}
                {% set ns.ecarts = ns.ecarts + [cible - mesure] %}
              {% endif %}
            {% endfor %}
            {{ ([0] + ns.ecarts) | max | round(1) }}
          piece_ecart_maximum: >-
            {% set vannes = {
              'climate.radiateur_chambre_julie': 'Chambre Julie',
              'climate.radiateur_chambre_pablo': 'Chambre Pablo',
              'climate.radiateur_grande_chambre_amis': 'Grande chambre amis',
              'climate.radiateur_petite_chambre_amis': 'Petite chambre amis',
              'climate.radiateur_chambre_mathias': 'Chambre Mathias',
              'climate.radiateur_sdb_garcons': 'SDB garçons',
              'climate.radiateur_sdb_julie': 'SDB Julie',
              'climate.radiateur_parents': 'Chambre parents',
              'climate.radiateur_dressing': 'Dressing',
              'climate.radiateur_sdb_parents': 'SDB parents',
              'climate.radiateur_atelier': 'Atelier',
              'climate.radiateur_salle_cine': 'Salle ciné',
              'climate.radiateur_buanderie': 'Buanderie'
            } %}
            {% set ns = namespace(ecart=0, piece='Aucune') %}
            {% for vanne, piece in vannes.items() %}
              {% set cible = state_attr(vanne, 'temperature') %}
              {% set mesure = state_attr(vanne, 'current_temperature') %}
              {% if states(vanne) in ['auto', 'heat'] and cible is number and mesure is number and cible - mesure > ns.ecart %}
                {% set ns.ecart = cible - mesure %}
                {% set ns.piece = piece %}
              {% endif %}
            {% endfor %}
            {{ ns.piece }}
          pieces_en_demande: >-
            {% set vannes = {
              'climate.radiateur_chambre_julie': 'Chambre Julie',
              'climate.radiateur_chambre_pablo': 'Chambre Pablo',
              'climate.radiateur_grande_chambre_amis': 'Grande chambre amis',
              'climate.radiateur_petite_chambre_amis': 'Petite chambre amis',
              'climate.radiateur_chambre_mathias': 'Chambre Mathias',
              'climate.radiateur_sdb_garcons': 'SDB garçons',
              'climate.radiateur_sdb_julie': 'SDB Julie',
              'climate.radiateur_parents': 'Chambre parents',
              'climate.radiateur_dressing': 'Dressing',
              'climate.radiateur_sdb_parents': 'SDB parents',
              'climate.radiateur_atelier': 'Atelier',
              'climate.radiateur_salle_cine': 'Salle ciné',
              'climate.radiateur_buanderie': 'Buanderie'
            } %}
            {% set ns = namespace(pieces=[]) %}
            {% for vanne, piece in vannes.items() %}
              {% set cible = state_attr(vanne, 'temperature') %}
              {% set mesure = state_attr(vanne, 'current_temperature') %}
              {% if states(vanne) in ['auto', 'heat'] and cible is number and mesure is number and cible - mesure > 0.5 %}
                {% set ns.pieces = ns.pieces + [piece] %}
              {% endif %}
            {% endfor %}
            {{ ns.pieces | join(', ') if ns.pieces else 'Aucune' }}

script:
  chauffage_appliquer_planning_cible:
    alias: Chauffage. Appliquer le planning d’une pièce
    mode: queued
    fields:
      cible:
        required: true
        selector:
          select:
            options: [buanderie, chambre_julie, chambre_pablo, grande_chambre_amis, petite_chambre_amis, chambre_mathias, sdb_garcons, sdb_julie, chambre_parents, dressing, sdb_parents, atelier, salle_cine]
    sequence:
      - variables:
          cibles:
            buanderie: [radiateur_buanderie]
            chambre_julie: [radiateur_chambre_julie]
            chambre_pablo: [radiateur_chambre_pablo]
            grande_chambre_amis: [radiateur_grande_chambre_amis]
            petite_chambre_amis: [radiateur_petite_chambre_amis]
            chambre_mathias: [radiateur_chambre_mathias]
            sdb_garcons: [radiateur_sdb_garcons]
            sdb_julie: [radiateur_sdb_julie]
            chambre_parents: [radiateur_parents]
            dressing: [radiateur_dressing]
            sdb_parents: [radiateur_sdb_parents]
            atelier: [radiateur_atelier]
            salle_cine: [radiateur_salle_cine]
          slugs:
            buanderie: buanderie
            chambre_julie: chambre_julie
            chambre_pablo: chambre_pablo
            grande_chambre_amis: grande_chambre_amis
            petite_chambre_amis: petite_chambre_amis
            chambre_mathias: chambre_mathias
            sdb_garcons: sdb_mathias
            sdb_julie: sdb_julie
            chambre_parents: chambre_parents
            dressing: dressing
            sdb_parents: sdb_parents
            atelier: atelier
            salle_cine: salle_cine
      - if:
          - condition: template
            value_template: "{{ cible not in cibles }}"
        then:
          - stop: "Cible de planning inconnue : aucune commande envoyée."
            error: true
      - variables:
          planning_slug: "{{ slugs[cible] }}"
          planning_semaine: "{{ states('input_text.chauffage_planning_' ~ planning_slug ~ '_semaine') }}"
          planning_samedi: "{{ states('input_text.chauffage_planning_' ~ planning_slug ~ '_samedi') }}"
          planning_dimanche: "{{ states('input_text.chauffage_planning_' ~ planning_slug ~ '_dimanche') }}"
          format_planning: '^(?:(?:[01][0-9]|2[0-3]):[0-5][0-9]/(?:(?:[4-9]|[12][0-9]|3[0-4])(?:[.][05])?|35(?:[.]0)?))(?: (?:(?:[01][0-9]|2[0-3]):[0-5][0-9]/(?:(?:[4-9]|[12][0-9]|3[0-4])(?:[.][05])?|35(?:[.]0)?))){5}$'
      - if:
          - condition: template
            value_template: >-
              {{ planning_semaine | trim in ['', 'unknown', 'unavailable', 'none']
                 or planning_samedi | trim in ['', 'unknown', 'unavailable', 'none']
                 or planning_dimanche | trim in ['', 'unknown', 'unavailable', 'none']
                 or not (planning_semaine | trim | regex_match(format_planning))
                 or not (planning_samedi | trim | regex_match(format_planning))
                 or not (planning_dimanche | trim | regex_match(format_planning)) }}
        then:
          - stop: "Planning invalide : six changements HH:MM/température entre 4 et 35 °C, par pas de 0,5 °C, sont requis pour chaque type de journée."
            error: true
      - repeat:
          for_each: "{{ cibles[cible] }}"
          sequence:
            - variables:
                base: "{{ repeat.item }}"
            - action: text.set_value
              target: {entity_id: "text.{{ base }}_weekly_schedule_monday"}
              data: {value: "{{ planning_semaine }}"}
            - action: text.set_value
              target: {entity_id: "text.{{ base }}_weekly_schedule_tuesday"}
              data: {value: "{{ planning_semaine }}"}
            - action: text.set_value
              target: {entity_id: "text.{{ base }}_weekly_schedule_wednesday"}
              data: {value: "{{ planning_semaine }}"}
            - action: text.set_value
              target: {entity_id: "text.{{ base }}_weekly_schedule_thursday"}
              data: {value: "{{ planning_semaine }}"}
            - action: text.set_value
              target: {entity_id: "text.{{ base }}_weekly_schedule_friday"}
              data: {value: "{{ planning_semaine }}"}
            - action: text.set_value
              target: {entity_id: "text.{{ base }}_weekly_schedule_saturday"}
              data: {value: "{{ planning_samedi }}"}
            - action: text.set_value
              target: {entity_id: "text.{{ base }}_weekly_schedule_sunday"}
              data: {value: "{{ planning_dimanche }}"}
            - action: climate.set_hvac_mode
              target: {entity_id: "climate.{{ base }}"}
              data: {hvac_mode: auto}

  chauffage_boost_cible:
    alias: Chauffage. Boost d’une pièce
    mode: queued
    fields:
      cible:
        required: true
        selector:
          select:
            options: [buanderie, chambre_julie, chambre_pablo, grande_chambre_amis, petite_chambre_amis, chambre_mathias, sdb_garcons, sdb_julie, chambre_parents, dressing, sdb_parents, atelier, salle_cine]
    sequence:
      - variables:
          cibles:
            buanderie: [radiateur_buanderie]
            chambre_julie: [radiateur_chambre_julie]
            chambre_pablo: [radiateur_chambre_pablo]
            grande_chambre_amis: [radiateur_grande_chambre_amis]
            petite_chambre_amis: [radiateur_petite_chambre_amis]
            chambre_mathias: [radiateur_chambre_mathias]
            sdb_garcons: [radiateur_sdb_garcons]
            sdb_julie: [radiateur_sdb_julie]
            chambre_parents: [radiateur_parents]
            dressing: [radiateur_dressing]
            sdb_parents: [radiateur_sdb_parents]
            atelier: [radiateur_atelier]
            salle_cine: [radiateur_salle_cine]
          duree: "{{ states('input_number.chauffage_duree_boost') }}"
      - if:
          - condition: template
            value_template: "{{ cible not in cibles or not is_number(duree) }}"
        then:
          - stop: "Cible inconnue ou durée de boost indisponible : aucune commande envoyée."
            error: true
      - repeat:
          for_each: "{{ cibles[cible] }}"
          sequence:
            - action: number.set_value
              target: {entity_id: "number.{{ repeat.item }}_temporary_mode_duration"}
              data: {value: "{{ duree | int }}"}
            - action: select.select_option
              target: {entity_id: "select.{{ repeat.item }}_temporary_mode_select"}
              data: {option: boost}

  chauffage_mode_maison_appliquer:
    alias: Chauffage. Appliquer le mode maison
    mode: restart
    sequence:
      - variables:
          mode_maison: "{{ states('input_select.chauffage_mode_maison') }}"
          toutes_vannes: [climate.radiateur_chambre_julie, climate.radiateur_chambre_pablo, climate.radiateur_grande_chambre_amis, climate.radiateur_petite_chambre_amis, climate.radiateur_chambre_mathias, climate.radiateur_sdb_garcons, climate.radiateur_sdb_julie, climate.radiateur_parents, climate.radiateur_dressing, climate.radiateur_sdb_parents, climate.radiateur_atelier, climate.radiateur_salle_cine, climate.radiateur_buanderie]
          temperatures:
            Confort: input_number.chauffage_profil_confort
            Nuit: input_number.chauffage_profil_nuit
            Absence: input_number.chauffage_profil_absence
      - if:
          - condition: template
            value_template: "{{ mode_maison not in ['Auto', 'Arrêt'] and mode_maison not in temperatures }}"
        then:
          - stop: "Mode chauffage maison inconnu : aucune commande envoyée."
            error: true
      - if:
          - condition: template
            value_template: >-
              {{ mode_maison in temperatures and
                 not is_number(states(temperatures[mode_maison])) }}
        then:
          - stop: "Profil chauffage indisponible : aucune commande envoyée."
            error: true
      - choose:
          - conditions: "{{ mode_maison == 'Auto' }}"
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ toutes_vannes }}"
                data:
                  hvac_mode: auto
          - conditions: "{{ mode_maison == 'Arrêt' }}"
            sequence:
              - action: climate.set_hvac_mode
                target:
                  entity_id: "{{ toutes_vannes }}"
                data:
                  hvac_mode: "off"
        default:
          - action: climate.set_temperature
            target:
              entity_id: "{{ toutes_vannes }}"
            data:
              hvac_mode: heat
              temperature: "{{ states(temperatures[mode_maison]) | float }}"

automation:
  - id: chauffage_mode_maison_sur_changement
    alias: Chauffage. Appliquer un changement du mode maison
    description: >-
      Applique uniquement une transition entre deux modes valides.
      La restauration des helpers au démarrage ne commande pas les vannes.
    mode: restart
    triggers:
      - trigger: state
        entity_id: input_select.chauffage_mode_maison
        from:
          - Auto
          - Confort
          - Nuit
          - Absence
          - Arrêt
        to:
          - Auto
          - Confort
          - Nuit
          - Absence
          - Arrêt
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none
             and trigger.from_state.state != trigger.to_state.state }}
    actions:
      - action: script.chauffage_mode_maison_appliquer
