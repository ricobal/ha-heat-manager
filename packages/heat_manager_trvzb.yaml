            {{ expand('climate.radiateur_sdb_garcons') | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count }}
          nombre_vannes: 1
          batterie_minimum: >-
            {% set b = ['sensor.radiateur_sdb_garcons_battery'] | map('states') | map('float', none) | reject('eq', none) | list %}
            {{ b | min if b | count else none }}
          mode: >-
