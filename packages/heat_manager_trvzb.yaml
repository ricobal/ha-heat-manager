        unit_of_measurement: "°C"
        device_class: temperature
        state_class: measurement
        attributes:
          en_chauffe: >-
            {{ expand('climate.radiateur_dressing') | selectattr('attributes.hvac_action', 'eq', 'heating') | list | count }}
          nombre_vannes: 1
          batterie_minimum: >-
            {% set b = ['sensor.radiateur_dressing_battery'] | map('states') | map('float', none) | reject('eq', none) | list %}
            {{ b | min if b | count else none }}
          mode: >-
            {% set s = expand('climate.radiateur_dressing') | map(attribute='state') | unique | list %}
            {{ s[0] if s | count == 1 else 'mixte' }}
      - name: Chauffage. SDB parents
