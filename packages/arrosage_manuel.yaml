# Arrosage manuel d'une zone depuis l'écran Arrosage (2026-09-26)
# Un appui sur une zone ouvre une fenêtre Browser Mod : nom de la zone, durée
# (− / +, remise à 1 min à chaque ouverture), boutons Annuler et Arroser.

input_number:
  etherain_duree_manuelle:
    name: Etherain durée manuelle
    min: 1
    max: 60
    step: 1
    mode: box
    unit_of_measurement: min
    icon: mdi:timer-outline

rest_command:
  etherain_irrigation_zone_manuel:
    url: >-
      http://192.168.1.81/result.cgi?xi=0:{% for z in range(1, 9) %}{{ duree | int if z == zone | int else 0 }}{{ ':' if not loop.last }}{% endfor %}

script:
  etherain_arroser_zone:
    alias: Etherain arroser une zone
    icon: mdi:sprinkler
    mode: single
    fields:
      zone:
        name: Zone
        required: true
        selector:
          number:
            min: 1
            max: 5
      duree:
        name: Durée
        required: true
        default: 1
        selector:
          number:
            min: 1
            max: 60
            unit_of_measurement: min
    sequence:
      - condition: template
        value_template: "{{ 1 <= zone | int(0) <= 5 and duree | int(0) > 0 }}"
      # Un cycle en cours est arrêté proprement (ses automatisations envoient l'arrêt)
      - if:
          - condition: state
            entity_id:
              - input_boolean.etherain_cycle_court
              - input_boolean.etherain_cycle_moyen
              - input_boolean.etherain_cycle_long
            match: any
            state: "on"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.etherain_cycle_court
                - input_boolean.etherain_cycle_moyen
                - input_boolean.etherain_cycle_long
          - delay: 3
      - action: rest_command.etherain_login
      - action: rest_command.etherain_stop_irrigation
      - action: rest_command.etherain_irrigation_zone_manuel
        data:
          zone: "{{ zone | int }}"
          duree: "{{ duree | int }}"

  etherain_arroser_duree_choisie:
    alias: Etherain arroser une zone (durée de la fenêtre)
    icon: mdi:sprinkler-variant
    mode: single
    fields:
      zone:
        name: Zone
        required: true
        selector:
          number:
            min: 1
            max: 5
    sequence:
      - action: script.etherain_arroser_zone
        data:
          zone: "{{ zone | int }}"
          duree: "{{ states('input_number.etherain_duree_manuelle') | int(1) }}"
