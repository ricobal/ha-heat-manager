# Arrosage manuel d'une zone depuis l'écran Arrosage (2026-09-25)
# Un appui sur une zone ouvre la fenêtre du script « Arroser <zone> » :
# durée réglable (1 min par défaut) puis « Exécuter ».

rest_command:
  etherain_irrigation_zone_manuel:
    url: >-
      http://192.168.1.81/result.cgi?xi=0:{% for z in range(1, 9) %}{{ duree | int if z == zone | int else 0 }}{{ ':' if not loop.last }}{% endfor %}

script:
  etherain_arroser_zone:
    alias: Etherain arroser une zone
    icon: mdi:sprinkler
    mode: single
    fields:
      zone:
        name: Zone
        required: true
        selector:
          number:
            min: 1
            max: 5
      duree:
        name: Durée
        required: true
        default: 1
        selector:
          number:
            min: 1
            max: 60
            unit_of_measurement: min
    sequence:
      - condition: template
        value_template: "{{ 1 <= zone | int(0) <= 5 and duree | int(0) > 0 }}"
      # Un cycle en cours est arrêté proprement (ses automatisations envoient l'arrêt)
      - if:
          - condition: state
            entity_id:
              - input_boolean.etherain_cycle_court
              - input_boolean.etherain_cycle_moyen
              - input_boolean.etherain_cycle_long
            match: any
            state: "on"
        then:
          - action: input_boolean.turn_off
            target:
              entity_id:
                - input_boolean.etherain_cycle_court
                - input_boolean.etherain_cycle_moyen
                - input_boolean.etherain_cycle_long
          - delay: 3
      - action: rest_command.etherain_login
      - action: rest_command.etherain_stop_irrigation
      - action: rest_command.etherain_irrigation_zone_manuel
        data:
          zone: "{{ zone | int }}"
          duree: "{{ duree | int }}"

  etherain_arroser_bureau: &arroser
    alias: Arroser Bureau
    icon: mdi:briefcase
    mode: single
    fields:
      duree:
        name: Durée
        required: true
        default: 1
        selector:
          number:
            min: 1
            max: 60
            mode: slider
            unit_of_measurement: min
    variables:
      zone: 1
    sequence:
      - action: script.etherain_arroser_zone
        data:
          zone: "{{ zone }}"
          duree: "{{ duree | default(1) }}"

  etherain_arroser_salon:
    <<: *arroser
    alias: Arroser Salon
    icon: mdi:sofa
    variables:
      zone: 2

  etherain_arroser_cedre:
    <<: *arroser
    alias: Arroser Cèdre
    icon: mdi:pine-tree
    variables:
      zone: 3

  etherain_arroser_chambre:
    <<: *arroser
    alias: Arroser Chambre
    icon: mdi:bed
    variables:
      zone: 4

  etherain_arroser_gouttes:
    <<: *arroser
    alias: Arroser Gouttes
    icon: mdi:water-opacity
    variables:
      zone: 5
